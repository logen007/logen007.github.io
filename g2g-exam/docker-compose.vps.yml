services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: g2g_exam
      POSTGRES_USER: g2g
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - g2g_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g2g -d g2g_exam"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql://g2g:${POSTGRES_PASSWORD}@postgres:5432/g2g_exam
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - g2g_uploads:/data/uploads
    ports:
      - "127.0.0.1:8787:8080"

volumes:
  g2g_pgdata:
  g2g_uploads:
