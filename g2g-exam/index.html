<html lang="de">
<head>

<title>G2G Prüfungstraining</title>

<style>
:root{--brand:#5b4d88;--brand2:#423765;--ink:#252432;--muted:#777585;--line:#e7e5ec;--bg:#f7f7fa;--panel:#fff;--ok:#2f8a62;--warn:#c38d28;--danger:#b44b4b;--shadow:0 6px 24px rgba(35,31,50,.07)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}
.shell{min-height:100vh}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;font-weight:700}.brandmark{width:38px;height:38px;border:2px solid var(--brand);border-radius:10px;display:grid;place-items:center;color:var(--brand);font-weight:800}.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.03em}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#edeaf6;color:var(--brand);font-weight:700}.pill{padding:7px 10px;border-radius:999px;background:#f1eff7;color:var(--brand2);font-size:12px;font-weight:600;border:1px solid #e1ddee}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:10px 15px;font-weight:600}.btn:hover{border-color:#cfcbd9}.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}.btn.primary:hover{background:#352d52}.btn.ghost{background:transparent}.btn.danger{color:var(--danger);border-color:#e5c9c9}.btn.sm{padding:7px 10px;font-size:12px}.container{max-width:1160px;margin:0 auto;padding:34px 24px 60px}.login-wrap{max-width:980px;margin:58px auto;padding:0 24px;display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:stretch}.login-hero{background:linear-gradient(145deg,#f0edf8,#fff);border:1px solid var(--line);border-radius:16px;padding:46px}.login-hero h1{font-size:39px;line-height:1.08;margin:10px 0 18px}.login-hero p{color:var(--muted);font-size:17px;line-height:1.65;max-width:590px}.login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center}.google{display:flex;gap:12px;align-items:center;justify-content:center;padding:13px 16px;border:1px solid #d8d6df;border-radius:8px;background:#fff;font-weight:600}.gdot{width:22px;height:22px;border-radius:50%;border:5px solid #4285f4;border-top-color:#ea4335;border-right-color:#fbbc05;border-bottom-color:#34a853}.staff-link{margin-top:18px;text-align:center;color:var(--brand);font-size:13px;background:none;border:0}.kicker{text-transform:uppercase;letter-spacing:.13em;color:var(--brand);font-weight:700;font-size:11px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.page-head h1{margin:0 0 6px;font-size:29px}.subtle{color:var(--muted);font-size:13px}.summary{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:8px;align-items:center;margin-bottom:26px}.summary .label{font-size:12px;color:var(--muted)}.summary .value{font-size:20px;font-weight:750;margin-top:4px}.summary .exam-name{font-weight:700}.summary .pass{color:var(--ok)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px}.section-title h2{font-size:18px;margin:0}.exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.exam-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;min-height:220px;display:flex;flex-direction:column}.exam-card:hover{box-shadow:var(--shadow)}.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--brand);background:#f0eef7;border-radius:999px;padding:5px 8px}.exam-card h3{font-size:17px;margin:14px 0 7px}.exam-meta{font-size:12px;color:var(--muted);line-height:1.7}.exam-card .grow{flex:1}.scoreline{border-top:1px solid var(--line);padding-top:12px;margin-top:14px;display:flex;justify-content:space-between;font-size:12px}.scoreline strong{font-size:14px}.exam-actions{display:flex;gap:8px;margin-top:14px}.history-table,.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.history-table th,.history-table td,.table th,.table td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}.history-table th,.table th{background:#fafafd;color:var(--muted);font-weight:700}.history-table tr:last-child td,.table tr:last-child td{border-bottom:0}.status{font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;display:inline-flex}.status.green{background:#e9f5ef;color:#2f7a58}.status.yellow{background:#fff5df;color:#956d1e}.status.gray{background:#efeff3;color:#696778}.status.red{background:#faeaea;color:#a54040}
.exam-app{background:#f5f5f8;min-height:100vh}.exam-top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.exam-logo{font-size:18px;font-weight:800;color:var(--brand)}.exam-top-right{display:flex;align-items:center;gap:18px;font-size:12px}.timer{font-variant-numeric:tabular-nums;font-weight:700}.progressbar{height:4px;background:#eceaf0}.progressbar span{display:block;height:100%;background:var(--brand);width:20%}.exam-stage{max-width:1120px;margin:0 auto;padding:26px 28px 22px}.exam-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.answered{font-size:12px;color:var(--muted)}.instruction{font-size:12px;color:var(--muted);margin-bottom:18px}.question-sheet{background:#fff;border:1px solid #e2e0e7;border-radius:5px;padding:24px;min-height:520px}.qblock{padding:16px 0;border-bottom:1px solid #eceaf0}.qblock:last-child{border-bottom:0}.qblock h4{margin:0 0 7px;font-size:12px;color:#676575}.qtext{font-size:14px;line-height:1.65}.answer-select{margin-top:10px;width:100%;max-width:400px;border:1px solid #d9d7e0;border-radius:4px;padding:9px 10px;background:#fff}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}.adbox{border:1px solid var(--line);padding:13px;border-radius:4px;margin-bottom:10px;font-size:12px;line-height:1.55}.adletter{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eeeaf7;color:var(--brand2);font-weight:700;margin-right:7px}.cloze{line-height:2.35;font-size:14px}.inline-select{border:1px solid #d5d2dc;border-radius:4px;padding:5px 26px 5px 8px;background:#fff;margin:0 4px}.audio-box{border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:#fafafd}.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand2);color:#fff;font-size:16px}.wave{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--brand) 32%,#e2e0e8 32%)}.writing{width:100%;min-height:300px;border:1px solid #d8d6de;border-radius:5px;padding:14px;resize:vertical;line-height:1.6}.exam-footer{max-width:1120px;margin:0 auto;padding:0 28px 26px;display:flex;justify-content:space-between;align-items:center}.exam-sys{font-size:11px;color:#767482;display:flex;gap:14px}.result-card{max-width:700px;margin:56px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:34px;text-align:center}.big-score{font-size:48px;font-weight:800;color:var(--brand2);margin:8px}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.metric{border:1px solid var(--line);border-radius:8px;padding:14px}.metric b{font-size:18px;display:block;margin-top:5px}
.admin-layout{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 66px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 14px}.nav-title{font-size:10px;color:#9a98a5;font-weight:800;letter-spacing:.11em;text-transform:uppercase;padding:6px 10px}.nav-btn{width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:6px;color:#575565;margin:2px 0;font-weight:600;font-size:13px}.nav-btn.active,.nav-btn:hover{background:#f0eef7;color:var(--brand2)}.admin-main{padding:28px;min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.filter{display:flex;gap:8px}.field{border:1px solid #d8d6df;border-radius:6px;padding:9px 10px;background:#fff}.owner{display:flex;align-items:center;gap:7px}.owner .mini{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#eeecf5;color:var(--brand);font-size:10px;font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}.cards2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.statcards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px}.stat span{font-size:11px;color:var(--muted)}.stat b{font-size:25px;display:block;margin-top:5px}.ownership-lock{font-size:11px;color:#8a8795}.modal{position:fixed;inset:0;background:rgba(28,25,36,.36);display:grid;place-items:center;z-index:60;padding:20px}.modal-card{background:#fff;border-radius:12px;width:min(680px,100%);max-height:88vh;overflow:auto;padding:24px;box-shadow:0 20px 80px rgba(20,18,28,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-group label{display:block;font-size:11px;font-weight:700;color:#777483;margin-bottom:6px}.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid #d7d5de;border-radius:6px;padding:10px}.toast{position:fixed;right:20px;bottom:20px;background:#2f2c3c;color:#fff;padding:12px 16px;border-radius:7px;font-size:12px;box-shadow:var(--shadow);z-index:100}.role-switch{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:7px;z-index:90}.role-switch button{border:0;background:none;padding:7px 9px;font-size:11px;border-radius:5px}.role-switch button.active{background:#eeeaf7;color:var(--brand2);font-weight:700}
@media(max-width:900px){.login-wrap{grid-template-columns:1fr}.exam-grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.summary>div:first-child{grid-column:1/-1}.admin-layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav-title{display:none}.nav-btn{white-space:nowrap;width:auto}.two-col{grid-template-columns:1fr}.statcards{grid-template-columns:1fr 1fr}.result-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.topbar{padding:0 14px}.container{padding:22px 14px}.exam-grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.login-hero{padding:28px}.login-hero h1{font-size:31px}.exam-stage{padding:18px 12px}.question-sheet{padding:14px}.exam-footer{padding:0 12px 18px}.admin-main{padding:18px 12px}.statcards,.cards2,.form-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.table-wrap{overflow:auto}.role-switch{left:10px;right:10px;display:flex;justify-content:center}}
</style>
</head>
<body>
<div id="app" class="shell"></div>
<div id="roleSwitch" class="role-switch hidden" aria-label="Demo role switcher"><button data-role="student">Schüler</button><button data-role="teacher">Lehrkraft</button><button data-role="master">Master Admin</button></div>
<div id="toast" class="toast hidden"></div>
<script>
(() => {
const app=document.getElementById('app');const rs=document.getElementById('roleSwitch');const toast=document.getElementById('toast');
const state={role:null,view:'login',examStep:0,timer:90*60,teacherTab:'exams',masterTab:'teachers',gradeRequested:false,requestApproved:false,studentName:'Nguyen Van A'};
const exams=[{id:1,name:'Deutsch B1 – Mock Test 01',level:'B1',owner:'Cô Lan',attempts:2,best:201,latest:194,status:'available'},{id:2,name:'Deutsch B1 – Mock Test 02',level:'B1',owner:'Cô Mai',attempts:1,best:218,latest:218,status:'available'},{id:3,name:'Deutsch B1 – Mock Test 03',level:'B1',owner:'Cô Lan',attempts:0,best:null,latest:null,status:'available'},{id:4,name:'Deutsch B1 – Mock Test 04',level:'B1',owner:'Cô Hương',attempts:1,best:null,latest:null,status:'inprogress'}];
const qbank=[{id:'Q-B1-001',skill:'Lesen',part:'Teil 1',type:'Matching',owner:'Cô Lan',correct:'64%'},{id:'Q-B1-024',skill:'Lesen',part:'Teil 3',type:'Two-column',owner:'Cô Mai',correct:'52%'},{id:'Q-B1-031',skill:'Sprachbausteine',part:'Teil 1',type:'Inline cloze',owner:'Cô Lan',correct:'71%'},{id:'Q-B1-052',skill:'Hören',part:'Teil 2',type:'Richtig/Falsch',owner:'Cô Hương',correct:'58%'}];
function notify(msg){toast.textContent=msg;toast.classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.add('hidden'),2200)}
function topbar(){return `<header class="topbar"><div class="brand"><div class="brandmark">G2G</div><div>Prüfungstraining<small>TELC-orientierte Prüfungssimulation</small></div></div><div class="userbox"><span class="pill">${state.role==='student'?'Schüler':state.role==='teacher'?'Lehrkraft':'Master Admin'}</span><div class="avatar">${state.role==='student'?'NA':state.role==='teacher'?'L':'M'}</div></div></header>`}
function login(){rs.classList.add('hidden');app.innerHTML=`<div class="login-wrap"><section class="login-hero"><div class="kicker">G2G Career · Prüfungstraining</div><h1>Üben, bis sich die echte Prüfung vertraut anfühlt.</h1><p>Eine ruhige, prüfungsnahe Umgebung für Deutsch B1/B2: Aufgabenformat, Navigation, Zeitdruck und Hörverstehen – so ähnlich wie im digitalen Prüfungsraum.</p><div style="margin-top:28px;font-size:12px;color:#777585">Lesen · Sprachbausteine · Hören · Schreiben · Sprechen</div></section><section class="login-card"><h2 style="margin-top:0">Anmelden</h2><p class="subtle" style="line-height:1.6;margin-bottom:22px">Schüler melden sich mit ihrem Google-Konto an. Ergebnisse und alle bisherigen Versuche bleiben im persönlichen Verlauf gespeichert.</p><button id="googleLogin" class="google"><span class="gdot"></span> Mit Google anmelden</button><button id="staffLogin" class="staff-link">Lehrkräfte & Administration</button><div style="height:1px;background:var(--line);margin:26px 0"></div><div class="subtle">Demo: Die Anmeldung ist in diesem Prototyp simuliert.</div></section></div>`;document.getElementById('googleLogin').onclick=()=>{state.role='student';state.view='dashboard';showRoleSwitch();render()};document.getElementById('staffLogin').onclick=()=>{state.role='teacher';state.view='admin';showRoleSwitch();render()}}
function showRoleSwitch(){rs.classList.remove('hidden');[...rs.querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.role===state.role))}
function studentDashboard(){app.innerHTML=topbar()+`<main class="container"><div class="page-head"><div><div class="kicker">Mein Prüfungsbereich</div><h1>Hallo, ${state.studentName}</h1><div class="subtle">Wähle eine Prüfung und starte direkt.</div></div><button class="btn" id="historyBtn">Alle Ergebnisse</button></div><section class="summary"><div><div class="label">Letzte Prüfung</div><div class="exam-name">Deutsch B1 – Mock Test 02</div><div class="subtle" style="margin-top:4px">04.10.2026 · Versuch #1</div></div><div><div class="label">Letztes Ergebnis</div><div class="value">218 / 300</div></div><div><div class="label">Bestes Ergebnis</div><div class="value">218</div></div><div><div class="label">Versuche</div><div class="value">3</div></div><div><div class="label">Status</div><div class="value pass">BESTANDEN</div></div></section><div class="section-title"><h2>Prüfung auswählen</h2><span class="subtle">4 verfügbare Tests</span></div><section class="exam-grid">${exams.map(e=>`<article class="exam-card"><div><span class="tag">${e.level} · DIGITAL MOCK</span><h3>${e.name}</h3><div class="exam-meta">Lesen + Sprachbausteine 90 Min.<br>Hören ca. 30 Min. · Schreiben 30 Min.</div></div><div class="grow"></div>${e.attempts?`<div class="scoreline"><span>${e.status==='inprogress'?'Noch nicht abgeschlossen':`Schon ${e.attempts}× absolviert`}</span>${e.best?`<strong>Best ${e.best}</strong>`:''}</div>`:`<div class="scoreline"><span>Noch nicht versucht</span><strong>Neu</strong></div>`}<div class="exam-actions">${e.status==='inprogress'?`<button class="btn primary startExam" data-id="${e.id}">Fortsetzen</button><button class="btn restart" data-id="${e.id}">Neu starten</button>`:`<button class="btn primary startExam" data-id="${e.id}">${e.attempts?'Nochmal prüfen':'Prüfung starten'}</button>`}</div></article>`).join('')}</section><div class="section-title"><h2>Letzte Versuche</h2></div><table class="history-table"><thead><tr><th>Prüfung</th><th>Versuch</th><th>Ergebnis</th><th>Status</th><th>Datum</th></tr></thead><tbody><tr><td>Deutsch B1 – Mock Test 02</td><td>#1</td><td>218 / 300</td><td><span class="status green">Bestanden</span></td><td>04.10.2026</td></tr><tr><td>Deutsch B1 – Mock Test 01</td><td>#2</td><td>201 / 300</td><td><span class="status green">Bestanden</span></td><td>01.10.2026</td></tr><tr><td>Deutsch B1 – Mock Test 01</td><td>#1</td><td>184 / 300</td><td><span class="status green">Bestanden</span></td><td>29.09.2026</td></tr></tbody></table></main>`;
app.querySelectorAll('.startExam').forEach(b=>b.onclick=()=>{state.view='exam';state.examStep=0;state.timer=90*60;render()});app.querySelectorAll('.restart').forEach(b=>b.onclick=()=>notify('Alter Versuch wird als abgebrochen gespeichert. Neuer Versuch gestartet.'));document.getElementById('historyBtn').onclick=()=>notify('Im Produkt öffnet sich hier die vollständige Versuchshistorie.')}
const tasks=[{title:'Leseverstehen · Teil 1',instruction:'Lesen Sie die Texte und wählen Sie jeweils die passende Überschrift.',kind:'match'},{title:'Sprachbausteine · Teil 1',instruction:'Wählen Sie für jede Lücke die richtige Lösung.',kind:'cloze'},{title:'Hörverstehen · Teil 2',instruction:'Sie hören den Text. Entscheiden Sie: richtig oder falsch.',kind:'audio'},{title:'Schreiben',instruction:'Schreiben Sie eine E-Mail und bearbeiten Sie alle angegebenen Punkte.',kind:'writing'}];
function taskContent(t){if(t.kind==='match')return `<div class="qblock"><h4>Text 1</h4><div class="qtext">Viele Menschen arbeiten heute teilweise von zu Hause. Für Unternehmen entstehen dadurch neue Möglichkeiten, aber auch neue Regeln für Zusammenarbeit und Kommunikation.</div><select class="answer-select ans"><option value="">Select an answer</option><option>a) Arbeiten ohne Büro</option><option>b) Neue Regeln im Team</option><option>c) Freizeit am Wochenende</option></select></div><div class="qblock"><h4>Text 2</h4><div class="qtext">Kochsendungen im Fernsehen gibt es schon lange. Heute verbinden sie Unterhaltung, Information und Gemeinschaftserlebnis.</div><select class="answer-select ans"><option value="">Select an answer</option><option>a) Ein Trend, der bleibt</option><option>b) Nur wer kocht, lernt</option><option>c) Kleidung im Beruf</option></select></div><div class="qblock"><h4>Text 3</h4><div class="qtext">Immer mehr Firmen bieten ihren Mitarbeitenden flexible Arbeitszeiten. Dadurch lassen sich Familie, Weiterbildung und Arbeit besser verbinden.</div><select class="answer-select ans"><option value="">Select an answer</option><option>a) Flexibler durch den Alltag</option><option>b) Reisen ohne Plan</option><option>c) Wohnen auf dem Land</option></select></div>`;
if(t.kind==='cloze')return `<div class="qblock"><div class="cloze">An alle Kunden<br><br>Sehr geehrter Herr Schröder,<br><br>zum Start in das neue Geschäftsjahr <select class="inline-select ans"><option value=""></option><option>haben</option><option>hat</option><option>sind</option></select> wir uns für Sie etwas ganz Besonderes ausgedacht. Einen attraktiven Gewinn <select class="inline-select ans"><option value=""></option><option>seit</option><option>zu</option><option>mit</option></select> dem Beginn des neuen Geschäftsjahres feiern wir unsere erfolgreiche Buchidee. Machen Sie mit! Es <select class="inline-select ans"><option value=""></option><option>warten</option><option>wartet</option><option>gewartet</option></select> auf Sie sehr interessante Preise.</div></div>`;
if(t.kind==='audio')return `<div class="audio-box"><button class="play" id="playBtn">▶</button><div><div style="font-size:12px;font-weight:700;margin-bottom:8px">Hörtext · Wiedergabe 1 von 1</div><div class="wave" id="wave"></div></div><span class="subtle" id="audioTime">02:14</span></div><div class="qblock"><h4>21</h4><div class="qtext">Die Sprecherin möchte am kommenden Wochenende verreisen.</div><label style="display:inline-flex;gap:7px;margin:12px 18px 0 0"><input type="radio" name="q21"> Richtig</label><label style="display:inline-flex;gap:7px"><input type="radio" name="q21"> Falsch</label></div><div class="qblock"><h4>22</h4><div class="qtext">Sie fährt mit dem Zug nach München.</div><label style="display:inline-flex;gap:7px;margin:12px 18px 0 0"><input type="radio" name="q22"> Richtig</label><label style="display:inline-flex;gap:7px"><input type="radio" name="q22"> Falsch</label></div>`;
return `<div class="qblock"><div class="qtext"><b>Aufgabe</b><br>Sie haben an einem Deutschkurs teilgenommen und möchten der Kursleitung schreiben. Schreiben Sie etwas zu allen vier Punkten: Grund Ihrer Nachricht, was Ihnen gefallen hat, was verbessert werden könnte, ob Sie den Kurs empfehlen würden.</div><textarea class="writing" id="writing" placeholder="Schreiben Sie hier Ihren Text ..."></textarea><div class="subtle" style="text-align:right;margin-top:7px"><span id="words">0</span> Wörter</div></div>`}
function examView(){const t=tasks[state.examStep];app.innerHTML=`<div class="exam-app"><header class="exam-top"><div class="exam-logo">G2G Prüfungstraining</div><div class="exam-top-right"><span>${state.examStep+1} / ${tasks.length}</span><span class="timer" id="timer"></span></div></header><div class="progressbar"><span style="width:${(state.examStep+1)/tasks.length*100}%"></span></div><main class="exam-stage"><div class="exam-title-row"><div><div class="kicker">Deutsch B1 · Mock Test 03</div><h2 style="margin:7px 0 0">${t.title}</h2></div><div class="answered" id="answered">0 answered</div></div><div class="instruction">${t.instruction}</div><section class="question-sheet">${taskContent(t)}</section></main><footer class="exam-footer"><button class="btn" id="prev" ${state.examStep===0?'disabled':''}>Previous</button><div class="exam-sys"><span>🔊 Audio</span><span>ENG</span><span>● Online</span></div><button class="btn primary" id="next">${state.examStep===tasks.length-1?'Prüfung abgeben':'Next'}</button></footer></div>`;updateTimer();document.getElementById('prev').onclick=()=>{if(state.examStep>0){state.examStep--;render()}};document.getElementById('next').onclick=()=>{if(state.examStep<tasks.length-1){state.examStep++;render()}else{state.view='result';render()}};app.querySelectorAll('.ans').forEach(x=>x.onchange=updateAnswered);app.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=updateAnswered);const w=document.getElementById('writing');if(w)w.oninput=()=>{document.getElementById('words').textContent=(w.value.trim().match(/\S+/g)||[]).length;updateAnswered()};const pb=document.getElementById('playBtn');if(pb)pb.onclick=()=>{pb.textContent='❚❚';notify('Audio läuft – Pause und Zurückspulen sind im Prüfungsmodus gesperrt.')}}
function updateAnswered(){const n=[...app.querySelectorAll('select')].filter(x=>x.value).length+[...new Set([...app.querySelectorAll('input[type=radio]:checked')].map(x=>x.name))].length+(document.getElementById('writing')?.value.trim()?1:0);const a=document.getElementById('answered');if(a)a.textContent=n+' answered'}
function updateTimer(){const el=document.getElementById('timer');if(!el)return;const m=Math.floor(state.timer/60),s=state.timer%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function resultView(){app.innerHTML=`${topbar()}<main class="container"><section class="result-card"><div class="kicker">Versuch abgeschlossen</div><h1 style="margin-bottom:0">Deutsch B1 – Mock Test 03</h1><div class="big-score">214 / 300</div><span class="status green">BESTANDEN</span><div class="result-grid"><div class="metric"><span class="subtle">Lesen</span><b>62 / 75</b></div><div class="metric"><span class="subtle">Hören</span><b>57 / 75</b></div><div class="metric"><span class="subtle">Schreiben</span><b>34 / 45</b></div><div class="metric"><span class="subtle">Sprechen</span><b>61 / 75</b></div></div><p class="subtle">Schreiben/Sprechen können in der echten Plattform zunächst als „Wird korrigiert“ erscheinen. Sobald die Lehrkraft veröffentlicht, wird automatisch eine E-Mail gesendet.</p><div style="display:flex;gap:8px;justify-content:center;margin-top:22px"><button class="btn" id="backDash">Zu meinen Tests</button><button class="btn primary" id="details">Ergebnisdetails</button></div></section></main>`;document.getElementById('backDash').onclick=()=>{state.view='dashboard';render()};document.getElementById('details').onclick=()=>notify('Detailansicht: Punkte je Teil, Fehler und Lehrerkommentar.')}
function adminShell(){const tabs=state.role==='master'?['teachers','exams','questions','grades','trash']:['exams','questions','grading','grades'];const labels={teachers:'Lehrkräfte',exams:'Prüfungen',questions:'Fragenbank',grading:'Korrektur',grades:'Ergebnisse',trash:'Papierkorb'};const active=state.role==='master'?state.masterTab:state.teacherTab;return topbar()+`<div class="admin-layout"><aside class="sidebar"><div class="nav-title">Administration</div>${tabs.map(t=>`<button class="nav-btn ${active===t?'active':''}" data-tab="${t}">${labels[t]}</button>`).join('')}</aside><main class="admin-main" id="adminMain"></main></div>`}
function admin(){app.innerHTML=adminShell();app.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{if(state.role==='master')state.masterTab=b.dataset.tab;else state.teacherTab=b.dataset.tab;render()});renderAdminMain()}
function renderAdminMain(){const main=document.getElementById('adminMain');const tab=state.role==='master'?state.masterTab:state.teacherTab;if(tab==='exams')main.innerHTML=examsAdmin();if(tab==='questions')main.innerHTML=questionsAdmin();if(tab==='grading')main.innerHTML=gradingAdmin();if(tab==='grades')main.innerHTML=gradesAdmin();if(tab==='teachers')main.innerHTML=teachersAdmin();if(tab==='trash')main.innerHTML=trashAdmin();bindAdmin(tab)}
function examsAdmin(){return `<div class="toolbar"><div><div class="kicker">Prüfungsverwaltung</div><h1 style="margin:6px 0">Alle Prüfungen</h1><div class="subtle">Jede Lehrkraft darf alle Prüfungen ansehen. Bearbeiten/Löschen nur durch Besitzer oder Master Admin.</div></div><button class="btn primary" id="newExam">+ Prüfung erstellen</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Prüfung</th><th>Ersteller</th><th>Status</th><th>Versuche</th><th>Aktionen</th></tr></thead><tbody><tr><td><b>Deutsch B1 – Mock Test 01</b><div class="subtle">B1 · 5 Teile</div></td><td><div class="owner"><span class="mini">L</span>Cô Lan</div></td><td><span class="status green">Veröffentlicht</span></td><td>146</td><td><button class="btn sm editOwn">Bearbeiten</button> <button class="btn sm danger softDelete">Löschen</button></td></tr><tr><td><b>Deutsch B1 – Mock Test 02</b><div class="subtle">B1 · 5 Teile</div></td><td><div class="owner"><span class="mini">M</span>Cô Mai</div></td><td><span class="status green">Veröffentlicht</span></td><td>98</td><td>${state.role==='master'?`<button class="btn sm">Bearbeiten</button>`:`<button class="btn sm">Ansehen</button> <button class="btn sm primary requestGrade">${state.gradeRequested?'Anfrage gesendet':'Korrektur anfragen'}</button>`}</td></tr><tr><td><b>Deutsch B2 – Mock Test 01</b><div class="subtle">B2 · Entwurf</div></td><td><div class="owner"><span class="mini">H</span>Cô Hương</div></td><td><span class="status gray">Entwurf</span></td><td>0</td><td><button class="btn sm">Ansehen</button></td></tr></tbody></table></div>`}
function questionsAdmin(){return `<div class="toolbar"><div><div class="kicker">Question Bank</div><h1 style="margin:6px 0">Fragenbank</h1><div class="subtle">Fragen sind für alle Lehrkräfte sichtbar und wiederverwendbar. Nur Ersteller/Master dürfen ändern oder löschen.</div></div><button class="btn primary" id="newQuestion">+ Frage erstellen</button></div><div class="filter" style="margin-bottom:14px"><select class="field"><option>B1</option><option>B2</option></select><select class="field"><option>Alle Fertigkeiten</option><option>Lesen</option><option>Hören</option></select><input class="field" placeholder="Frage suchen..." /></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Bereich</th><th>Typ</th><th>Ersteller</th><th>Statistik</th><th>Aktionen</th></tr></thead><tbody>${qbank.map(q=>`<tr><td><b>${q.id}</b></td><td>${q.skill}<div class="subtle">${q.part}</div></td><td>${q.type}</td><td><div class="owner"><span class="mini">${q.owner.slice(-3, -2)||'T'}</span>${q.owner}</div></td><td>${q.correct} richtig</td><td>${state.role==='master'||q.owner==='Cô Lan'?`<button class="btn sm">Bearbeiten</button> <button class="btn sm danger">Löschen</button>`:`<button class="btn sm">Ansehen</button> <span class="ownership-lock">Nur Besitzer darf bearbeiten</span>`}</td></tr>`).join('')}</tbody></table></div>`}
function gradingAdmin(){return `<div class="toolbar"><div><div class="kicker">Korrektur</div><h1 style="margin:6px 0">Korrekturzentrum</h1><div class="subtle">Nur eigene Prüfungen oder ausdrücklich freigegebene Prüfungen erscheinen hier.</div></div></div><div class="cards2"><div class="card"><h3 style="margin-top:0">Offene Korrekturen</h3><table class="table"><tr><td>Deutsch B1 – Mock Test 01<br><span class="subtle">Schreiben</span></td><td><b>18</b> offen</td><td><button class="btn sm primary gradeNow">Korrigieren</button></td></tr>${state.requestApproved?`<tr><td>Deutsch B1 – Mock Test 02<br><span class="subtle">Freigegeben von Cô Mai</span></td><td><b>6</b> offen</td><td><button class="btn sm primary">Korrigieren</button></td></tr>`:''}</table></div><div class="card"><h3 style="margin-top:0">Anfragen an meine Prüfungen</h3><div style="padding:8px 0"><b>Cô Hương</b> möchte <b>Mock Test 01</b> mitkorrigieren.</div><div style="display:flex;gap:7px"><button class="btn sm primary approve">Genehmigen</button><button class="btn sm decline">Ablehnen</button></div></div></div>`}
function gradesAdmin(){return `<div class="toolbar"><div><div class="kicker">Gradebook</div><h1 style="margin:6px 0">Ergebnisse</h1></div><div class="filter"><select class="field"><option>Bestes Ergebnis</option><option>Letztes Ergebnis</option><option>Alle Versuche</option></select><button class="btn">Export CSV</button></div></div><div class="statcards"><div class="stat"><span>Teilnehmende</span><b>128</b></div><div class="stat"><span>Versuche</span><b>362</b></div><div class="stat"><span>Ø Punktzahl</span><b>207</b></div><div class="stat"><span>Bestanden</span><b>72%</b></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Schüler</th><th>Lesen</th><th>Hören</th><th>Schreiben</th><th>Sprechen</th><th>Gesamt</th><th>Versuche</th></tr></thead><tbody><tr><td><b>Nguyen Van A</b><br><span class="subtle">nguyena@gmail.com</span></td><td>65</td><td>60</td><td>36</td><td>57</td><td><b>218</b></td><td>3</td></tr><tr><td><b>Tran Minh B</b></td><td>56</td><td>49</td><td>31</td><td>51</td><td><b>187</b></td><td>2</td></tr><tr><td><b>Le Thu C</b></td><td>71</td><td>67</td><td>39</td><td>64</td><td><b>241</b></td><td>5</td></tr></tbody></table></div>`}
function teachersAdmin(){return `<div class="toolbar"><div><div class="kicker">Master Admin</div><h1 style="margin:6px 0">Lehrkräfte & Rechte</h1><div class="subtle">Master Admin verwaltet Rollen und Berechtigungen.</div></div><button class="btn primary">+ Lehrkraft hinzufügen</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Lehrkraft</th><th>E-Mail</th><th>Prüfungen</th><th>Rechte</th><th></th></tr></thead><tbody><tr><td><b>Cô Lan</b></td><td>lan@g2gcareer.com</td><td>4</td><td>Erstellen · Korrigieren · Veröffentlichen</td><td><button class="btn sm">Rechte</button></td></tr><tr><td><b>Cô Mai</b></td><td>mai@g2gcareer.com</td><td>3</td><td>Erstellen · Korrigieren</td><td><button class="btn sm">Rechte</button></td></tr><tr><td><b>Cô Hương</b></td><td>huong@g2gcareer.com</td><td>2</td><td>Korrigieren</td><td><button class="btn sm">Rechte</button></td></tr></tbody></table></div>`}
function trashAdmin(){return `<div class="toolbar"><div><div class="kicker">Nur Master Admin</div><h1 style="margin:6px 0">Papierkorb</h1><div class="subtle">Lehrkräfte sehen diesen Bereich nicht. Dauerhaftes Löschen ist nur hier möglich.</div></div></div><div class="cards2"><div class="card"><h3 style="margin-top:0">Gelöschte Prüfungen</h3><table class="table"><tr><td><b>B1 Mock 00</b><br><span class="subtle">Gelöscht von Cô Lan · 03.10.2026</span></td><td><button class="btn sm restore">Wiederherstellen</button> <button class="btn sm danger perm">Dauerhaft löschen</button></td></tr></table></div><div class="card"><h3 style="margin-top:0">Gelöschte Fragen</h3><table class="table"><tr><td><b>Q-B1-008</b><br><span class="subtle">Gelöscht von Cô Mai</span></td><td><button class="btn sm">Wiederherstellen</button></td></tr></table></div></div>`}
function bindAdmin(tab){const n=document.getElementById('newExam');if(n)n.onclick=()=>openExamModal();const q=document.getElementById('newQuestion');if(q)q.onclick=()=>notify('Question Builder geöffnet: Typ, Inhalt, Antwort, Punkte, Audio.');app.querySelectorAll('.softDelete').forEach(b=>b.onclick=()=>notify('Prüfung in Papierkorb verschoben. Lehrkraft sieht den Papierkorb nicht.'));app.querySelectorAll('.requestGrade').forEach(b=>b.onclick=()=>{state.gradeRequested=true;b.textContent='Anfrage gesendet';notify('Korrekturanfrage an die Besitzerin gesendet.')});app.querySelectorAll('.approve').forEach(b=>b.onclick=()=>{state.requestApproved=true;notify('Korrekturrechte genehmigt.')});app.querySelectorAll('.decline').forEach(b=>b.onclick=()=>notify('Anfrage abgelehnt.'));app.querySelectorAll('.restore').forEach(b=>b.onclick=()=>notify('Element wiederhergestellt.'));app.querySelectorAll('.perm').forEach(b=>b.onclick=()=>notify('Demo: Dauerhaftes Löschen ist nur Master Admin erlaubt.'));app.querySelectorAll('.gradeNow').forEach(b=>b.onclick=()=>notify('Korrekturansicht geöffnet: Rubrik + Kommentar + Entwurf/Veröffentlichen.'))}
function openExamModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><div><div class="kicker">Exam Builder</div><h2 style="margin:5px 0">Neue Prüfung erstellen</h2></div><button class="btn sm" id="closeModal">✕</button></div><div class="form-grid"><div class="form-group"><label>Titel</label><input value="Deutsch B1 – Mock Test 05"></div><div class="form-group"><label>Niveau</label><select><option>B1</option><option>B2</option></select></div><div class="form-group"><label>Vorlage</label><select><option>TELC B1 Struktur</option><option>TELC B2 Struktur</option><option>Leer starten</option></select></div><div class="form-group"><label>Status</label><select><option>Entwurf</option><option>Veröffentlicht</option></select></div></div><div style="margin-top:18px" class="card"><b>Prüfungsstruktur</b><div class="subtle" style="margin:7px 0 13px">Die Teile können anschließend mit Fragen aus der Bank oder neuen Fragen gefüllt werden.</div><div style="display:grid;gap:8px"><div class="pill" style="justify-content:space-between;border-radius:6px">01 Lesen · 3 Teile <span>+ Aufgabe</span></div><div class="pill" style="justify-content:space-between;border-radius:6px">02 Sprachbausteine · 2 Teile <span>+ Aufgabe</span></div><div class="pill" style="justify-content:space-between;border-radius:6px">03 Hören · 3 Teile <span>+ Audio</span></div><div class="pill" style="justify-content:space-between;border-radius:6px">04 Schreiben <span>+ Aufgabe</span></div><div class="pill" style="justify-content:space-between;border-radius:6px">05 Sprechen <span>+ Aufgabe</span></div></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" id="cancelModal">Abbrechen</button><button class="btn primary" id="saveExam">Entwurf speichern</button></div></div></div>`);document.getElementById('closeModal').onclick=document.getElementById('cancelModal').onclick=()=>document.getElementById('modal').remove();document.getElementById('saveExam').onclick=()=>{document.getElementById('modal').remove();notify('Neue Prüfung als Entwurf gespeichert.')}}
function render(){showRoleSwitch();if(!state.role||state.view==='login'){login();return}if(state.role==='student'){if(state.view==='exam')examView();else if(state.view==='result')resultView();else studentDashboard()}else admin()}
rs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.role=b.dataset.role;state.view=state.role==='student'?'dashboard':'admin';showRoleSwitch();render()}));
setInterval(()=>{if(state.view==='exam'&&state.timer>0){state.timer--;updateTimer()}},1000);
login();
})();
</script>
