<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G2G Thi thử tiếng Đức</title><style>
:root{--brand:#5b4d88;--brand2:#423765;--ink:#242331;--muted:#777585;--line:#e7e5ec;--bg:#f7f7fa;--ok:#2f8a62;--danger:#b44b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:750}.logo{width:39px;height:39px;border:2px solid var(--brand);border-radius:9px;display:grid;place-items:center;color:var(--brand);font-weight:850}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}.pill{font-size:11px;color:var(--brand2);background:#f0eef7;border:1px solid #e0dced;border-radius:999px;padding:6px 9px}.container{max-width:1160px;margin:auto;padding:34px 22px 60px}.btn{border:1px solid #dddbe4;background:#fff;border-radius:7px;padding:10px 14px;font-weight:650;cursor:pointer}.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}.btn.sm{padding:7px 9px;font-size:12px}.btn.danger{color:var(--danger);border-color:#e6caca}.sub{font-size:12px;color:var(--muted)}.kicker{text-transform:uppercase;font-size:10px;letter-spacing:.13em;color:var(--brand);font-weight:800}.login{max-width:970px;margin:60px auto;padding:0 20px;display:grid;grid-template-columns:1.15fr .85fr;gap:25px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:36px}.hero{background:linear-gradient(145deg,#f1eef8,#fff)}.hero h1{font-size:39px;line-height:1.12;margin:10px 0 16px}.hero p{font-size:16px;line-height:1.7;color:var(--muted)}.google{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;border:1px solid #d9d6df;background:#fff;border-radius:8px;padding:13px;font-weight:650;cursor:pointer}.g{width:20px;height:20px;border-radius:50%;border:5px solid #4285f4;border-top-color:#ea4335;border-right-color:#fbbc05;border-bottom-color:#34a853}.staff{border:0;background:none;color:var(--brand);margin-top:16px;cursor:pointer}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:21px}.head h1{margin:5px 0 4px;font-size:29px}.summary{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:12px;margin-bottom:26px}.label{font-size:11px;color:var(--muted)}.val{font-size:20px;font-weight:800;margin-top:5px}.pass{color:var(--ok)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.section-title h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.exam{background:#fff;border:1px solid var(--line);border-radius:10px;padding:19px;min-height:218px;display:flex;flex-direction:column}.exam h3{font-size:17px;margin:13px 0 7px}.tag{font-size:10px;font-weight:800;color:var(--brand);background:#f0eef7;padding:5px 8px;border-radius:999px;display:inline-flex}.grow{flex:1}.meta{font-size:12px;color:var(--muted);line-height:1.7}.scoreline{border-top:1px solid var(--line);padding-top:11px;margin-top:13px;display:flex;justify-content:space-between;font-size:12px}.actions{display:flex;gap:7px;margin-top:13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{background:#fafafd;color:var(--muted)}.status{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;display:inline-flex}.green{background:#e9f5ef;color:#2f7a58}.gray{background:#efeff3;color:#696778}.examapp{min-height:100vh;background:#f5f5f8}.examtop{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 20px}.examlogo{font-weight:800;color:var(--brand)}.progress{height:4px;background:#eceaf0}.progress span{display:block;height:100%;background:var(--brand)}.stage{max-width:1120px;margin:auto;padding:26px}.title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.instruction{font-size:12px;color:var(--muted);margin-bottom:18px}.sheet{background:#fff;border:1px solid #e2e0e7;border-radius:5px;padding:24px;min-height:500px}.q{padding:15px 0;border-bottom:1px solid #eceaf0}.q:last-child{border-bottom:0}.qtext{font-size:14px;line-height:1.65}.ans{width:100%;max-width:400px;margin-top:10px;border:1px solid #d8d5df;border-radius:4px;padding:9px;background:#fff}.inline{border:1px solid #d8d5df;border-radius:4px;padding:5px 26px 5px 8px;background:#fff;margin:0 4px}.writing{width:100%;min-height:290px;border:1px solid #d8d5df;border-radius:5px;padding:13px;line-height:1.6}.examfoot{max-width:1120px;margin:auto;padding:0 26px 25px;display:flex;justify-content:space-between;align-items:center}.audio{border:1px solid var(--line);background:#fafafd;border-radius:6px;padding:18px;display:flex;align-items:center;gap:13px}.play{width:42px;height:42px;border:0;border-radius:50%;background:var(--brand2);color:#fff}.bar{height:5px;background:linear-gradient(90deg,var(--brand) 35%,#e3e1e8 35%);border-radius:99px;flex:1}.admin{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 66px)}.side{background:#fff;border-right:1px solid var(--line);padding:20px 13px}.nav{width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:6px;font-size:13px;font-weight:650;color:#5a5867;cursor:pointer}.nav.active,.nav:hover{background:#f0eef7;color:var(--brand2)}.main{padding:27px}.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px}.stat b{display:block;font-size:24px;margin-top:4px}.role{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 8px 30px rgba(30,28,40,.12);z-index:60}.role button{border:0;background:none;padding:7px 8px;font-size:11px;border-radius:5px;cursor:pointer}.role button.on{background:#eeeaf7;color:var(--brand2);font-weight:800}.toast{position:fixed;right:18px;bottom:65px;background:#302d3e;color:#fff;padding:11px 14px;border-radius:7px;font-size:12px;z-index:90}.modal{position:fixed;inset:0;background:rgba(26,23,35,.36);display:grid;place-items:center;padding:20px;z-index:80}.modalbox{background:#fff;border-radius:12px;width:min(680px,100%);padding:24px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{font-size:11px;font-weight:750;color:var(--muted);display:block;margin-bottom:5px}.fg input,.fg select{width:100%;padding:9px;border:1px solid #d8d5df;border-radius:6px}@media(max-width:900px){.login{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.summary>div:first-child{grid-column:1/-1}.admin{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid,.stats,.fg{grid-template-columns:1fr}.container,.main{padding:20px 12px}.summary{grid-template-columns:1fr 1fr}.hero h1{font-size:31px}.stage{padding:16px 12px}.sheet{padding:14px}.examfoot{padding:0 12px 18px}.role{left:10px;right:10px;display:flex;justify-content:center}}
</style></head><body><div id="app"></div><div id="roles" class="role hidden"><button data-r="student">Học viên</button><button data-r="teacher">Giáo viên</button><button data-r="master">Master Admin</button></div><div id="toast" class="toast hidden"></div><script>
(()=>{const app=document.getElementById('app'),roles=document.getElementById('roles'),toast=document.getElementById('toast');const s={role:null,view:'login',step:0,time:5400,ttab:'exams',mtab:'teachers',requested:false,approved:false};const exams=[['TELC B1 – Đề thi thử 01','B1',2,201,'available'],['TELC B1 – Đề thi thử 02','B1',1,218,'available'],['TELC B1 – Đề thi thử 03','B1',0,null,'available'],['TELC B1 – Đề thi thử 04','B1',1,null,'inprogress']];function note(x){toast.textContent=x;toast.classList.remove('hidden');clearTimeout(note.t);note.t=setTimeout(()=>toast.classList.add('hidden'),2200)}function top(){return `<header class="top"><div class="brand"><div class="logo">G2G</div><div>Thi thử tiếng Đức<small>Mô phỏng trải nghiệm thi TELC Digital</small></div></div><span class="pill">${s.role==='student'?'Học viên':s.role==='teacher'?'Giáo viên':'Master Admin'}</span></header>`}function syncRole(){roles.classList.toggle('hidden',!s.role);roles.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===s.role))}function login(){roles.classList.add('hidden');app.innerHTML=`<div class="login"><section class="hero"><div class="kicker">G2G CAREER · THI THỬ</div><h1>Luyện đến khi bước vào phòng thi thật không còn bỡ ngỡ.</h1><p>Môi trường thi thử tiếng Đức B1/B2 được thiết kế theo phong cách kỳ thi TELC Digital: cách hiển thị câu hỏi, chuyển phần, thời gian, nghe audio và thao tác làm bài.</p><div class="sub" style="margin-top:25px">Lesen · Sprachbausteine · Hören · Schreiben · Sprechen</div></section><section class="card" style="display:flex;flex-direction:column;justify-content:center"><h2 style="margin-top:0">Đăng nhập</h2><p class="sub" style="line-height:1.65;margin-bottom:22px">Học viên đăng nhập bằng tài khoản Google. Kết quả và toàn bộ lịch sử các lần thi sẽ được lưu trong tài khoản.</p><button class="google" id="google"><span class="g"></span> Đăng nhập bằng Google</button><button class="staff" id="staff">Đăng nhập dành cho Giáo viên / Admin</button><div class="sub" style="border-top:1px solid var(--line);padding-top:18px;margin-top:20px">Bản demo: đăng nhập đang được mô phỏng.</div></section></div>`;google.onclick=()=>{s.role='student';s.view='dash';render()};staff.onclick=()=>{s.role='teacher';s.view='admin';render()}}function dash(){app.innerHTML=top()+`<main class="container"><div class="head"><div><div class="kicker">KHU VỰC HỌC VIÊN</div><h1>Xin chào, Nguyễn Văn A</h1><div class="sub">Chọn bài thi để bắt đầu.</div></div><button class="btn" id="allres">Xem toàn bộ kết quả</button></div><section class="summary"><div><div class="label">Bài thi gần nhất</div><b>TELC B1 – Đề thi thử 02</b><div class="sub" style="margin-top:4px">04/10/2026 · Lần thi #1</div></div><div><div class="label">Điểm gần nhất</div><div class="val">218 / 300</div></div><div><div class="label">Điểm cao nhất</div><div class="val">218</div></div><div><div class="label">Số lần thi</div><div class="val">3</div></div><div><div class="label">Kết quả</div><div class="val pass">ĐẠT</div></div></section><div class="section-title"><h2>Chọn bài thi</h2><span class="sub">4 bài đang mở</span></div><section class="grid">${exams.map((e,i)=>`<article class="exam"><div><span class="tag">${e[1]} · THI THỬ DIGITAL</span><h3>${e[0]}</h3><div class="meta">Đọc + Ngữ pháp 90 phút<br>Nghe khoảng 30 phút · Viết 30 phút</div></div><div class="grow"></div><div class="scoreline"><span>${e[4]==='inprogress'?'Đang làm dở':e[2]?`Đã thi ${e[2]} lần`:'Chưa từng thi'}</span>${e[3]?`<b>Cao nhất ${e[3]}</b>`:'<b>Mới</b>'}</div><div class="actions">${e[4]==='inprogress'?`<button class="btn primary start">Tiếp tục</button><button class="btn restart">Làm lại từ đầu</button>`:`<button class="btn primary start">${e[2]?'Thi lại':'Bắt đầu thi'}</button>`}</div></article>`).join('')}</section><div class="section-title"><h2>Các lần thi gần đây</h2></div><div class="tablewrap"><table class="table"><thead><tr><th>Bài thi</th><th>Lần</th><th>Điểm</th><th>Kết quả</th><th>Ngày thi</th></tr></thead><tbody><tr><td>TELC B1 – Đề thi thử 02</td><td>#1</td><td>218 / 300</td><td><span class="status green">Đạt</span></td><td>04/10/2026</td></tr><tr><td>TELC B1 – Đề thi thử 01</td><td>#2</td><td>201 / 300</td><td><span class="status green">Đạt</span></td><td>01/10/2026</td></tr><tr><td>TELC B1 – Đề thi thử 01</td><td>#1</td><td>184 / 300</td><td><span class="status green">Đạt</span></td><td>29/09/2026</td></tr></tbody></table></div></main>`;app.querySelectorAll('.start').forEach(x=>x.onclick=()=>{s.view='exam';s.step=0;s.time=5400;render()});app.querySelectorAll('.restart').forEach(x=>x.onclick=()=>note('Lần thi cũ được đánh dấu bỏ dở và bắt đầu một lần thi mới.'));allres.onclick=()=>note('Trang lịch sử đầy đủ sẽ hiển thị tất cả các lần thi của học viên.')}const tasks=[['Đọc hiểu · Phần 1','Lesen Sie die Texte und wählen Sie jeweils die passende Überschrift.','match'],['Sprachbausteine · Phần 1','Wählen Sie für jede Lücke die richtige Lösung.','cloze'],['Nghe hiểu · Phần 2','Sie hören den Text. Entscheiden Sie: richtig oder falsch.','audio'],['Viết','Schreiben Sie eine E-Mail und bearbeiten Sie alle angegebenen Punkte.','write']];function content(k){if(k==='match')return `<div class="q"><div class="qtext">Viele Menschen arbeiten heute teilweise von zu Hause. Für Unternehmen entstehen dadurch neue Möglichkeiten, aber auch neue Regeln für Zusammenarbeit und Kommunikation.</div><select class="ans"><option value="">Chọn đáp án</option><option>a) Arbeiten ohne Büro</option><option>b) Neue Regeln im Team</option><option>c) Freizeit am Wochenende</option></select></div><div class="q"><div class="qtext">Kochsendungen im Fernsehen gibt es schon lange. Heute verbinden sie Unterhaltung, Information und Gemeinschaftserlebnis.</div><select class="ans"><option value="">Chọn đáp án</option><option>a) Ein Trend, der bleibt</option><option>b) Nur wer kocht, lernt</option><option>c) Kleidung im Beruf</option></select></div>`;if(k==='cloze')return `<div class="q"><div class="qtext" style="line-height:2.4">An alle Kunden<br><br>Sehr geehrter Herr Schröder,<br><br>zum Start in das neue Geschäftsjahr <select class="inline ans"><option value=""></option><option>haben</option><option>hat</option><option>sind</option></select> wir uns für Sie etwas ganz Besonderes ausgedacht. Einen attraktiven Gewinn <select class="inline ans"><option value=""></option><option>seit</option><option>zu</option><option>mit</option></select> dem Beginn des neuen Geschäftsjahres feiern wir unsere erfolgreiche Buchidee.</div></div>`;if(k==='audio')return `<div class="audio"><button class="play" id="play">▶</button><div style="min-width:0;flex:1"><b style="font-size:12px">Audio · Lượt nghe 1/1</b><div class="bar" style="margin-top:9px"></div></div><span class="sub">02:14</span></div><div class="q"><div class="qtext">Die Sprecherin möchte am kommenden Wochenende verreisen.</div><label style="margin-right:18px"><input type="radio" name="q1"> Richtig</label><label><input type="radio" name="q1"> Falsch</label></div>`;return `<div class="q"><div class="qtext"><b>Aufgabe</b><br>Sie haben an einem Deutschkurs teilgenommen und möchten der Kursleitung schreiben. Schreiben Sie etwas zu allen vier Punkten.</div><textarea class="writing" id="writing" placeholder="Viết câu trả lời tại đây..."></textarea></div>`}function exam(){const t=tasks[s.step];app.innerHTML=`<div class="examapp"><header class="examtop"><div class="examlogo">G2G Thi thử</div><div><span class="sub">Phần ${s.step+1}/${tasks.length}</span> &nbsp; <b id="timer"></b></div></header><div class="progress"><span style="width:${(s.step+1)/tasks.length*100}%"></span></div><main class="stage"><div class="title-row"><div><div class="kicker">TELC B1 · ĐỀ THI THỬ 03</div><h2 style="margin:7px 0 0">${t[0]}</h2></div><div class="sub" id="answered">0 câu đã trả lời</div></div><div class="instruction">${t[1]}</div><section class="sheet">${content(t[2])}</section></main><footer class="examfoot"><button class="btn" id="prev" ${s.step===0?'disabled':''}>Quay lại</button><div class="sub">🔊 Âm thanh &nbsp; · &nbsp; ● Đang trực tuyến</div><button class="btn primary" id="next">${s.step===tasks.length-1?'Nộp bài':'Tiếp theo'}</button></footer></div>`;timer();prev.onclick=()=>{if(s.step){s.step--;render()}};next.onclick=()=>{if(s.step<tasks.length-1){s.step++;render()}else{s.view='result';render()}};const p=document.getElementById('play');if(p)p.onclick=()=>{p.textContent='❚❚';note('Audio đang phát. Ở chế độ thi, không được tua lại hoặc phát lại.')}}function timer(){const e=document.getElementById('timer');if(e)e.textContent=`${String(Math.floor(s.time/60)).padStart(2,'0')}:${String(s.time%60).padStart(2,'0')}`}function result(){app.innerHTML=top()+`<main class="container"><section class="card" style="max-width:700px;margin:35px auto;text-align:center"><div class="kicker">HOÀN THÀNH LẦN THI</div><h1>TELC B1 – Đề thi thử 03</h1><div style="font-size:48px;font-weight:850;color:var(--brand2)">214 / 300</div><span class="status green">ĐẠT</span><div class="stats" style="margin-top:24px"><div class="stat"><span class="sub">Đọc</span><b>62/75</b></div><div class="stat"><span class="sub">Nghe</span><b>57/75</b></div><div class="stat"><span class="sub">Viết</span><b>34/45</b></div><div class="stat"><span class="sub">Nói</span><b>61/75</b></div></div><p class="sub">Nếu bài có phần giáo viên cần chấm, kết quả sẽ hiển thị “Đang chờ chấm”. Khi giáo viên công bố điểm, hệ thống sẽ gửi email cho học viên.</p><button class="btn" id="back">Về danh sách bài thi</button></section></main>`;back.onclick=()=>{s.view='dash';render()}}function adminShell(){const tabs=s.role==='master'?['teachers','exams','bank','grades','trash']:['exams','bank','grading','grades'];const lbl={teachers:'Giáo viên',exams:'Bài thi',bank:'Ngân hàng câu hỏi',grading:'Chấm bài',grades:'Bảng điểm',trash:'Thùng rác'};const a=s.role==='master'?s.mtab:s.ttab;return top()+`<div class="admin"><aside class="side">${tabs.map(x=>`<button class="nav ${a===x?'active':''}" data-tab="${x}">${lbl[x]}</button>`).join('')}</aside><main class="main" id="main"></main></div>`}function admin(){app.innerHTML=adminShell();app.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{if(s.role==='master')s.mtab=b.dataset.tab;else s.ttab=b.dataset.tab;render()});adminMain()}function adminMain(){const m=document.getElementById('main'),t=s.role==='master'?s.mtab:s.ttab;if(t==='exams')m.innerHTML=`<div class="toolbar"><div><div class="kicker">QUẢN LÝ BÀI THI</div><h1>Tất cả bài thi</h1><div class="sub">Giáo viên được xem bài của nhau; chỉ chủ sở hữu hoặc Master Admin được sửa/xóa.</div></div><button class="btn primary" id="newexam">+ Tạo bài thi</button></div><div class="tablewrap"><table class="table"><tr><th>Bài thi</th><th>Người tạo</th><th>Trạng thái</th><th>Lượt thi</th><th>Thao tác</th></tr><tr><td><b>TELC B1 – Đề 01</b></td><td>Cô Lan</td><td><span class="status green">Đã xuất bản</span></td><td>146</td><td><button class="btn sm">Chỉnh sửa</button> <button class="btn sm danger del">Xóa</button></td></tr><tr><td><b>TELC B1 – Đề 02</b></td><td>Cô Mai</td><td><span class="status green">Đã xuất bản</span></td><td>98</td><td>${s.role==='master'?'<button class="btn sm">Chỉnh sửa</button>':`<button class="btn sm">Xem</button> <button class="btn sm primary req">${s.requested?'Đã xin chấm':'Xin chấm'}</button>`}</td></tr></table></div>`;if(t==='bank')m.innerHTML=`<div class="toolbar"><div><div class="kicker">QUESTION BANK</div><h1>Ngân hàng câu hỏi</h1><div class="sub">Mọi giáo viên đều xem và sử dụng được. Chỉ người tạo hoặc Master Admin được sửa/xóa.</div></div><button class="btn primary" id="newq">+ Tạo câu hỏi</button></div><div class="tablewrap"><table class="table"><tr><th>ID</th><th>Kỹ năng</th><th>Loại</th><th>Người tạo</th><th>Thao tác</th></tr><tr><td><b>Q-B1-001</b></td><td>Lesen · Teil 1</td><td>Matching</td><td>Cô Lan</td><td><button class="btn sm">Chỉnh sửa</button> <button class="btn sm danger">Xóa</button></td></tr><tr><td><b>Q-B1-024</b></td><td>Lesen · Teil 3</td><td>Two-column</td><td>Cô Mai</td><td>${s.role==='master'?'<button class="btn sm">Chỉnh sửa</button>':'<button class="btn sm">Xem / dùng lại</button>'}</td></tr></table></div>`;if(t==='grading')m.innerHTML=`<div class="toolbar"><div><div class="kicker">CHẤM BÀI</div><h1>Danh sách cần chấm</h1></div></div><div class="card"><table class="table"><tr><td>TELC B1 – Đề 01<br><span class="sub">Schreiben</span></td><td><b>18</b> bài</td><td><button class="btn sm primary">Bắt đầu chấm</button></td></tr>${s.approved?'<tr><td>TELC B1 – Đề 02<br><span class="sub">Được Cô Mai cấp quyền</span></td><td>6 bài</td><td><button class="btn sm primary">Chấm</button></td></tr>':''}</table><h3>Yêu cầu chấm bài thi của tôi</h3><p><b>Cô Hương</b> xin chấm TELC B1 – Đề 01.</p><button class="btn sm primary approve">Duyệt</button> <button class="btn sm">Từ chối</button></div>`;if(t==='grades')m.innerHTML=`<div class="toolbar"><div><div class="kicker">BẢNG ĐIỂM</div><h1>Kết quả học viên</h1></div><select class="btn"><option>Điểm cao nhất</option><option>Điểm gần nhất</option><option>Tất cả lần thi</option></select></div><div class="stats"><div class="stat"><span class="sub">Học viên</span><b>128</b></div><div class="stat"><span class="sub">Lượt thi</span><b>362</b></div><div class="stat"><span class="sub">Điểm TB</span><b>207</b></div><div class="stat"><span class="sub">Tỷ lệ đạt</span><b>72%</b></div></div><table class="table"><tr><th>Học viên</th><th>Đọc</th><th>Nghe</th><th>Viết</th><th>Nói</th><th>Tổng</th><th>Số lần</th></tr><tr><td>Nguyễn Văn A</td><td>65</td><td>60</td><td>36</td><td>57</td><td><b>218</b></td><td>3</td></tr><tr><td>Trần Minh B</td><td>56</td><td>49</td><td>31</td><td>51</td><td><b>187</b></td><td>2</td></tr></table>`;if(t==='teachers')m.innerHTML=`<div class="toolbar"><div><div class="kicker">MASTER ADMIN</div><h1>Giáo viên & phân quyền</h1></div><button class="btn primary">+ Thêm giáo viên</button></div><table class="table"><tr><th>Giáo viên</th><th>Email</th><th>Bài thi</th><th>Quyền</th></tr><tr><td>Cô Lan</td><td>lan@g2gcareer.com</td><td>4</td><td>Tạo đề · Chấm · Xuất bản</td></tr><tr><td>Cô Mai</td><td>mai@g2gcareer.com</td><td>3</td><td>Tạo đề · Chấm</td></tr></table>`;if(t==='trash')m.innerHTML=`<div class="toolbar"><div><div class="kicker">CHỈ MASTER ADMIN</div><h1>Thùng rác</h1><div class="sub">Giáo viên không nhìn thấy khu vực này.</div></div></div><table class="table"><tr><th>Mục đã xóa</th><th>Người xóa</th><th>Thao tác</th></tr><tr><td>TELC B1 – Đề 00</td><td>Cô Lan</td><td><button class="btn sm">Khôi phục</button> <button class="btn sm danger perm">Xóa vĩnh viễn</button></td></tr></table>`;bind()}function bind(){const n=document.getElementById('newexam');if(n)n.onclick=modal;const q=document.getElementById('newq');if(q)q.onclick=()=>note('Mở trình tạo câu hỏi: chọn loại câu, nhập nội dung, đáp án, điểm và audio.');document.querySelectorAll('.del').forEach(x=>x.onclick=()=>note('Bài thi được chuyển vào Thùng rác. Giáo viên không thấy Thùng rác.'));document.querySelectorAll('.req').forEach(x=>x.onclick=()=>{s.requested=true;x.textContent='Đã xin chấm';note('Đã gửi yêu cầu xin chấm cho giáo viên tạo bài.')});document.querySelectorAll('.approve').forEach(x=>x.onclick=()=>{s.approved=true;note('Đã cấp quyền chấm bài.')});document.querySelectorAll('.perm').forEach(x=>x.onclick=()=>note('Chỉ Master Admin có quyền xóa vĩnh viễn.'))}function modal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="kicker">EXAM BUILDER</div><h2>Tạo bài thi mới</h2><div class="fg"><div><label>Tên bài thi</label><input value="TELC B1 – Đề thi thử 05"></div><div><label>Trình độ</label><select><option>B1</option><option>B2</option></select></div><div><label>Mẫu cấu trúc</label><select><option>TELC B1</option><option>TELC B2</option><option>Tạo trống</option></select></div><div><label>Trạng thái</label><select><option>Bản nháp</option><option>Xuất bản</option></select></div></div><div style="margin-top:18px;padding:15px;border:1px solid var(--line);border-radius:8px"><b>Cấu trúc bài thi</b><p class="sub">Đọc 3 phần · Sprachbausteine 2 phần · Nghe 3 phần · Viết · Nói</p></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" id="close">Hủy</button><button class="btn primary" id="save">Lưu bản nháp</button></div></div></div>`);close.onclick=()=>modal.remove();save.onclick=()=>{document.getElementById('modal').remove();note('Đã lưu bài thi mới ở trạng thái bản nháp.')}}function render(){syncRole();if(!s.role){login();return}if(s.role==='student'){if(s.view==='exam')exam();else if(s.view==='result')result();else dash()}else admin()}roles.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.role=b.dataset.r;s.view=s.role==='student'?'dash':'admin';render()});setInterval(()=>{if(s.view==='exam'&&s.time>0){s.time--;timer()}},1000);login()})();
</script></body></html>
