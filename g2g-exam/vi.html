<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>G2G Thi thử tiếng Đức</title>
  <meta name="description" content="Hệ thống thi thử tiếng Đức G2G, mô phỏng trải nghiệm thi trên máy tính.">
  <link rel="stylesheet" href="./styles.css?v=20261007-04">
  <link rel="stylesheet" href="./enhancements.css?v=20261007-04">
  <script>
    function showBootError(){
      var status=document.getElementById('bootStatus');
      if(!status)return;
      status.innerHTML='<strong>Hệ thống chưa tải được đầy đủ.</strong><br>Hãy <button type="button" onclick="location.reload()" style="border:0;background:none;padding:0;text-decoration:underline;cursor:pointer">Tải lại</button>.';
      status.style.color='#8a3b12';
    }
    window.addEventListener('error',showBootError);
    window.addEventListener('unhandledrejection',showBootError);
    window.setTimeout(showBootError,9000);
  </script>
</head>
<body>
  <div id="app">
    <main class="dang-nhap">
      <section class="gioi-thieu">
        <div class="nhan-muc">G2G CAREER · THI THỬ</div>
        <h1>Luyện đến khi bước vào phòng thi thật không còn bỡ ngỡ.</h1>
        <p>Hệ thống thi thử tiếng Đức G2G.</p>
        <div class="phu-de">Đọc hiểu · Ngữ pháp · Nghe hiểu · Viết · Nói</div>
      </section>
      <section class="hop-dang-nhap">
        <h2>Đăng nhập</h2>
        <p id="bootStatus">Nhấn Đăng nhập để vào trang học viên.</p>
        <a class="dang-nhap-google" id="googleLogin" href="/student" style="display:block;text-align:center;text-decoration:none">Đăng nhập</a>
      </section>
    </main>
  </div>
  <div id="toast" class="thong-bao an"></div>
  <script src="./src/demo-bypass.js?v=20261007-04"></script>
  <script src="./runtime-config.js?v=20261007-04"></script>
  <script type="module" src="./src/app.js?v=20261007-04"></script>
  <script type="module" src="./src/feature-loader.js?v=20261007-04"></script>
</body>
</html>
