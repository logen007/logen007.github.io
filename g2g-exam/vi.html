<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>G2G Thi thử tiếng Đức</title>
  <meta name="description" content="Hệ thống thi thử tiếng Đức G2G, mô phỏng trải nghiệm thi trên máy tính.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261009-91">
  <link rel="stylesheet" href="./enhancements.css?v=20261008-26">
  <style>
    .boot-shell{max-width:1600px;margin:16px auto;padding:0 32px;font-family:system-ui,sans-serif}
    .boot-header{display:flex;align-items:center;gap:12px;padding:18px 20px;border:1px solid #e4e6e9;border-radius:20px;background:#fff}
    .boot-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#f3f4f5;font-weight:600;color:#626870}
    .boot-brand{font-size:16px;color:#101318}.boot-brand small{display:block;font-size:12px;color:#626870;margin-top:4px}
    .boot-shape{background:#e9ebee;border-radius:12px;height:16px;animation:boot-pulse 1.6s ease-in-out infinite alternate}
    .boot-avatar{margin-left:auto;width:40px;height:40px;border-radius:50%}
    .boot-content{padding-top:32px;display:grid;gap:24px}.boot-title{width:42%;height:28px}.boot-filters{display:flex;gap:12px}.boot-filters i{width:180px;height:44px}
    .boot-card{padding:24px;border:1px solid #e4e6e9;border-radius:24px;background:#fff;display:grid;gap:24px}.boot-card i:nth-child(even){width:68%}
    .boot-feedback{color:#626870;font-size:14px;line-height:1.5}.boot-feedback:empty{display:none}
    .boot-feedback button{margin-left:8px;padding:8px 16px;border:1px solid #e4e6e9;border-radius:24px;background:#fff;color:#101318;cursor:pointer;font:inherit}
    @keyframes boot-pulse{to{opacity:.5}}
    .boot-shell[aria-busy="false"] .boot-shape{animation:none}
    @media(prefers-reduced-motion:reduce){.boot-shape{animation:none}}
    @media(max-width:680px){.boot-shell{padding:0 16px}.boot-title{width:65%}.boot-card{padding:20px}.boot-filters i{width:50%}}
  </style>
  <script>
    function showBootError(){
      var status=document.getElementById('bootStatus');
      if(!status)return;
      var shell=document.getElementById('bootShell');
      if(shell)shell.setAttribute('aria-busy','false');
      status.innerHTML='Hệ thống chưa tải được đầy đủ. Vui lòng thử lại.<button type="button" onclick="location.reload()">Thử lại</button>';
    }
    window.addEventListener('error',showBootError);
    window.addEventListener('unhandledrejection',showBootError);
    window.setTimeout(showBootError,20000);
  </script>
</head>
<body>
  <div id="app">
    <div class="boot-shell" id="bootShell" aria-busy="true" aria-label="Đang chuẩn bị giao diện">
      <div aria-hidden="true">
        <div class="boot-header"><span class="boot-mark">G2G</span><div class="boot-brand">Luyện thi tiếng Đức<small>G2G Career</small></div><i class="boot-shape boot-avatar"></i></div>
        <div class="boot-content"><i class="boot-shape boot-title"></i><div class="boot-filters"><i class="boot-shape"></i><i class="boot-shape"></i></div><div class="boot-card"><i class="boot-shape"></i><i class="boot-shape"></i><i class="boot-shape"></i><i class="boot-shape"></i><i class="boot-shape"></i></div></div>
      </div>
      <p class="boot-feedback" id="bootStatus" role="status"></p>
      <noscript>Vui lòng bật JavaScript để sử dụng website.</noscript>
    </div>
  </div>
  <div id="toast" class="thong-bao an"></div>
  <script src="./runtime-config.js?v=20261008-26"></script>
  <script type="module" src="./src/app.js?v=20261009-91"></script>
  <script type="module" src="./src/feature-loader.js?v=20261009-73"></script>
</body>
</html>
