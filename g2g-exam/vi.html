<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G2G Thi thử tiếng Đức</title><style>

er-radius:15px;padding:36px}.hero{background:linear-gradient(145deg,#f1eef8,#fff)}.hero h1{font-size:39px;line-height:1.12;margin:10px 0 16px}.hero p{font-size:16px;line-height:1.7;color:var(--muted)}.google{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;border:1px solid #d9d6df;background:#fff;border-radius:8px;padding:13px;font-weight:650;cursor:pointer}.g{width:20px;height:20px;border-radius:50%;border:5px solid #4285f4;border-top-color:#ea4335;border-right-color:#fbbc05;border-bottom-color:#34a853}.staff{border:0;background:none;color:var(--brand);margin-top:16px;cursor:pointer}.summary{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:12px;margin-bottom:26px}.label{font-size:11px;color:var(--muted)}.val{font-size:20px;font-weight:800;margin-top:5px}.pass{color:var(--ok)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.section-title h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.exam{background:#fff;border:1px solid var(--line);border-radius:10px;padding:19px;min-height:218px;display:flex;flex-direction:column}.exam h3{font-size:17px;margin:13px 0 7px}.tag{font-size:10px;font-weight:800;color:var(--brand);background:#f0eef7;padding:5px 8px;border-radius:999px;display:inline-flex}.grow{flex:1}.meta{font-size:12px;color:var(--muted);line-height:1.7}.scoreline{border-top:1px solid var(--line);padding-top:11px;margin-top:13px;display:flex;justify-content:space-between;font-size:12px}.actions{display:flex;gap:7px;margin-top:13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:middle}.table th{background:#fafafd;color:var(--muted);font-weight:750}.status{font-size:10px;font-weight:80 template-columns:1fr 1fr;gap:12px}.group label{font-size:11px;font-weight:750;color:var(--muted);display:block;margin-bottom:5px}.group input,.group select,.group textarea{width:100%;padding:9px;border:1px solid #d8d5df;border-radius:6px;background:#fff}.group textarea{min-height:100px;resize:vertical}.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.typebtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;text-align:left;cursor:pointer}.typebtn.active{border-color:var(--brand);background:#f4f1fa}.typebtn b{display:block;font-size:12px;margin-bottom:3px}.builder{display:grid;grid-template-columns:270px 1fr 270px;gap:14px;min-height:620px}.buildernav,.buildermain,.builderaside{background:#fff;border:1px solid var(--line);border-radius:10px}.buildernav{padding:12px}.buildermain{padding:18px}.builderaside{padding:14px}.sectionitem{border:1px solid var(--line);border-radius:7px;padding:11px;margin-bottom:8px;cursor:pointer}.sectionitem.active{border-color:var(--brand);background:#f4f1fa}.sectionitem b{font-size:12px}.sectionitem .sub{margin-top:4px}.qitem{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:7px;padding:10px;margin:8px 0}.qitem .left{min-width:0}.qitem strong{font-size:12px}.qitem .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:500px}.box{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}.help{background:#faf8ff;border:1px solid #e3def1;border-radius:8px;padding:12px;font-size:12px;line-height:1.6}.checkrow{display:flex;align-items:center;gap:7px;font-size:12px;margin:7px 0}.bankpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{border:1px solid var(--line);background:#fafafd;border-radius:8px;padding:14px;min-height:110px}.audiozone{border:1px dashed #cfcbd9;border-radius:8px;padding:18px;text-align:center;background:#fafafd}.optionrow{display:grid;grid-template-columns:34px 1fr 90px 36px;gap:8px;align-items:center;margin:8px 0}.optionrow input[type=text]{width:100%;padding:9px;border:1px solid #d8d5df;border-radius:6px}.examapp{min-height:100vh;background:#f5f5f8}.examtop{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 20px}.examlogo{font-weight:800;color:var(--brand)}.progress{height:4px;background:#eceaf0}.progress span{display:block;height:100%;background:var(--brand)}.stage{max-width:1120px;margin:auto;padding:26px}.sheet{background:#fff;border:1px solid #e2e0e7;border-radius:5px;padding:24px;min-height:500px}.q{padding:15px 0;border-bottom:1px solid #eceaf0}.qtext{font-size:14px;line-height:1.65}.ans{width:100%;max-width:400px;margin-top:10px;border:1px solid #d8d5df;border-radius:4px;padding:9px;background:#fff}.inline{border:1px solid #d8d5df;border-radius:4px;padding:5px 26px 5px 8px;background:#fff;margin:0 4px}.writing{width:100%;min-height:290px;border:1px solid #d8d5df;border-radius:5px;padding:13px;line-height:1.6}.examfoot{max-width:1120px;margin:auto;padding:0 26px 25px;display:flex;justify-content:space-between;align-items:center}.audio{border:1px solid var(--line);background:#fafafd;border-radius:6px;padding:18px;display:flex;align-items:center;gap:13px}.play{width:42px;height:42px;border:0;border-radius:50%;background:var(--brand2);color:#fff}.bar{height:5px;background:linear-gradient(90deg,var(--brand) 35%,#e3e1e8 35%);border-radius:99px;flex:1}.pending{max-width:720px;margin:40px auto;text-align:center}.pendingicon{width:70px;height:70px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:#f0eef7;color:var(--brand);font-size:30px}@media(max-width:1050px){.builder{grid-template-columns:220px 1fr}.builderaside{grid-column:1/-1}.typegrid{grid-template-columns:1fr 1fr}}@media(max-width:900px){.login{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.summary>div:fir </style></head><body><div id="app"></div><div id="roles" class="role hidden"><button data-r="student">Học viên</button><button data-r="teacher">Giáo viên</button><button data-r="master">Master Admin</button></div><div id="toast" class="toast hidden"></div><script>
(()=>{const app=document.getElementById('app'),roles=document.getElementById('roles'),toast=document.getElementById('toast');const s={role:null,view:'login',step:0,time:5400,ttab:'exams',mtab:'teachers',requested:false,approved:false,builderSection:0,qtype:'single',bankFilter:'all'};let bank=[{id:'Q-B1-001',level:'B1',skill:'Lesen',part:'Teil 1',type:'Matching',owner:'Cô Lan',uses:12,correct:'64%',title:'Homeoffice und Zusammenarbeit'},{id:'Q-B1-024',level:'B1',skill:'Lesen',part:'Teil 3',type:'Two-column',owner:'Cô Mai',uses:8,correct:'52%',title:'Situationen und Anzeigen'},{id:'Q-B1-031',level:'B1',skill:'Sprachbausteine',part:'Teil 1',type:'Inline cloze',owner:'Cô Lan',uses:15,correct:'71%',title:'Geschäftsjahr – Lückentext'},{id:'Q-B1-052',level:'B1',skill:'Hören',part:'Teil 2',type:'Richtig/Falsch',owner:'Cô Hương',uses:7,correct:'58%',title:'Wochenendreise'},{id:'Q-B2-014',level:'B2',skill:'Lesen',part:'Teil 2',type:'Single choice',owner:'Cô Mai',uses:3,correct:'46%',title:'Digitalisierung im Alltag'}];const exams=[['TELC B1 – Đề thi thử 01','B1',2,201,'available'],['TELC B1 – Đề thi thử 02','B1',1,218,'available'],['TELC B1 – Đề thi thử 03','B1',0,null,'available'],['TELC B1 – Đề thi thử 04','B1',1,null,'inprogress']];function note(x){toast.textContent=x;toast.classList.remove('hidden');clearTimeout(note.t);note.t=setTimeout(()=>toast.classList.add('hidden'),2300)}function top(){return `<header class="top"><div class="brand"><div class="logo">G2G</div><div>Thi thử tiếng Đức<small>Mô phỏng trải nghiệm thi TELC Digital</small></div></div><span class="pill">${s.role==='student'?'Học viên':s.role==='teacher'?'Giáo viên':'Master Admin'}</span></header>`}function syncRole(){roles.classList.toggle('hidden',!s.role);roles.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===s.role))}function login(){roles.classList.add('hidden');app.innerHTML=`<div class="login"><section class="hero"><div class="kicker">G2G CAREER · THI THỬ</div><h1>Luyện đến khi bước vào phòng thi thật không còn bỡ ngỡ.</h1><p>Môi trường thi thử tiếng Đức B1/B2 mô phỏng cách thao tác của bài thi TELC Digital: dạng câu hỏi, chuyển phần, thời gian, audio và cách nộp bài.</p><div class="sub" style="margin-top:25px">Lesen · Sprachbausteine · Hören · Schreiben · Sprechen</div></section><section class="loginbox"><h2 style="margin-top:0">Đăng nhập</h2><p class="sub" style="line-height:1.65;margin-bottom:22px">Học viên đăng nhập bằng Google. Kết quả và lịch sử các lần thi được lưu theo tài khoản.</p><button class="google" id="google"><span class="g"></span> Đăng nhập bằng Google</button><button class="staff" id="staff">Đăng nhập dành cho Giáo viên / Admin</button><div class="sub" style="border-top:1px solid var(--line);padding-top:18px;margin-top:20px">Bản demo: đăng nhập hiện đang mô phỏng.</div></section></div>`;document.getElementById('google').onclick=()=>{s.role='student';s.view='dash';render()};document.getElementById('staff').onclick=()=>{s.role='teacher';s.view='admin';render()}}function dash(){app.innerHTML=top()+`<main class="container"><div class="toolbar"><div><div class="kicker">KHU VỰC HỌC VIÊN</div><h1>Xin chào, Nguyễn Văn A</h1><div class="sub">Chọn bài thi để bắt đầu.</div></div><button class="btn">Xem toàn bộ kết quả</button></div><section class="summary"><div><div class="label">Bài thi gần nhất</div><b>TELC B1 – Đề thi thử 02</b><div class="sub" style="margin-top:4px">04/10/2026 · Lần thi #1</div></div><div><div class="label">Điểm gần nhất</div><div class="val">218 / 300</div></div><div><div class="label">Điểm cao nhất</div><div class="val">218</div></div><div><div class="label">Số lần thi</div><div class="val">3</div></div><div><div class="label">Kết quả</div><div class="val pass">ĐẠT</div></div></section><div class="section-title"><h2>Chọn bài thi</h2><span class="sub">4 bài đang mở</span></div><section class="grid">${exams.map(e=>`<article class="exam"><span class="tag">${e[1]} · THI THỬ DIGITAL</span><h3>${e[0]}</h3><div class="meta">Đọc + Ngữ pháp 90 phút<br>Nghe khoảng 30 phút · Viết 30 phút</div><div class="grow"></div><div class="scoreline"><span>${e[4]==='inprogress'?'Đang làm dở':e[2]?`Đã thi ${e[2]} lần`:'Chưa từng thi'}</span>${e[3]?`<b>Cao nhất ${e[3]}</b>`:'<b>Mới</b>'}</div><div class="actions">${e[4]==='inprogress'?'<button class="btn primary start">Tiếp tục</button><button class="btn restart">Làm lại từ đầu</button>':`<button class="btn primary start">${e[2]?'Thi lại':'Bắt đầu thi'}</button>`}</div></article>`).join('')}</section></main>`;app.querySelectorAll('.start').forEach(x=>x.onclick=()=>{s.view='exam';s.step=0;s.time=5400;render()});app.querySelectorAll('.restart').forEach(x=>x.onclick=()=>note('Lần thi cũ được đánh dấu bỏ dở; bắt đầu một lần thi mới.'))}const tasks=[['Đọc hiểu · Phần 1','Lesen Sie die Texte und wählen Sie jeweils die passende Überschrift.','match'],['Sprachbausteine · Phần 1','Wählen Sie für jede Lücke die richtige Lösung.','cloze'],['Nghe hiểu · Phần 2','Sie hören den Text. Entscheiden Sie: richtig oder falsch.','audio'],['Viết','Schreiben Sie eine E-Mail und bearbeiten Sie alle angegebenen Punkte.','write']];function content(k){if(k==='match')return `<div class="q"><div class="qtext">Viele Menschen arbeiten heute teilweise von zu Hause. Für Unternehmen entstehen dadurch neue Möglichkeiten, aber auch neue Regeln für Zusammenarbeit und Kommunikation.</div><select class="ans"><option>Chọn đáp án</option><option>a) Arbeiten ohne Büro</option><option>b) Neue Regeln im Team</option></select></div>`;if(k==='cloze')return `<div class="q"><div class="qtext" style="line-height:2.4">An alle Kunden<br><br>zum Start in das neue Geschäftsjahr <select class="inline"><option></option><option>haben</option><option>hat</option></select> wir uns für Sie etwas Besonderes ausgedacht.</div></div>`;if(k==='audio')return `<div class="audio"><button class="play" id="play">▶</button><div style="flex:1"><b style="font-size:12px">Audio · Lượt nghe 1/1</b><div class="bar" ng tiếng Đức tại đây...'}</textarea></div></div><div id="answerEditor">${answerEditor()}</div><h3>4. Media & chấm điểm</h3><div class="fg"><div class="audiozone"><b>Audio / hình ảnh</b><div class="sub" style="margin:5px 0 10px">Kéo thả hoặc chọn file cho câu Listening.</div><button class="btn sm">Chọn file</button></div><div><div class="group"><label>Điểm</label><input type="number" value="1"></div><label class="checkrow"><input type="checkbox" checked> Chấm tự động</label><label class="checkrow"><input type="checkbox"> Trộn thứ tự đáp án</label><label class="checkrow"><input type="checkbox"> Cho phép dùng lại trong nhiều đề</label></div></div><h3>5. Xem trước</h3><div class="preview"><div class="sub">Học viên sẽ thấy gần như sau:</div><p><b>Lesen Sie den Text und wählen Sie die richtige Antwort.</b></p><p>Viele Menschen arbeiten heute teilweise von zu Hause...</p><select class="field"><option>Chọn đáp án</option><option>A</option><option>B</option><option>C</option></select></div><div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px"><button class="btn" id="cancelq">Hủy</button><div><button class="btn" id="saveDraftQ">Lưu nháp</button> <button class="btn primary" id="saveq">${edit?'Lưu thay đổi':'Lưu vào ngân hàng'}</button></div></div></div></div>`);document.querySelectorAll('.typebtn').forEach(b=>b.onclick=()=>{s.qtype=b.dataset.type;document.querySelectorAll('.typebtn').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('answerEditor').innerHTML=answerEditor()});document.getElementById('closem').onclick=document.getElementById('cancelq').onclick=()=>document.getElementById('modal').remove();document.getElementById('saveDraftQ').onclick=()=>note('Đã lưu câu hỏi ở trạng thái bản nháp.');document.getElementById('saveq').onclick=()=>{if(!edit){const n='Q-B1-'+String(100+bank.length).padStart(3,'0');bank.unshift({id:n,level:'B1',skill:'Lesen',part:'Teil 1',type:'Single choice',owner:'Cô Lan',uses:0,correct:'—',title:document.getElementById('qtitle').value||'Câu hỏi mới'})}document.getElementById('modal').remove();note(edit?'Đã lưu thay đổi câu hỏi.':'Đã lưu câu hỏi vào Ngân hàng câu hỏi.');if((s.role==='teacher'?s.ttab:s.mtab)==='bank')render()}}function answerEditor(){if(s.qtype==='writing'||s.qtype==='speaking')return `<h3>4. Rubric / yêu cầu chấm</h3><div class="help">Phần tự luận sẽ không có đáp án đúng duy nhất. Giáo viên sẽ chấm theo rubric. Có thể cấu hình tiêu chí, điểm tối đa và nhận xét.</div>`;if(s.qtype==='matching')return `<h3>4. Cặp Matching</h3><div class="box"><div class="optionrow"><b>1</b><input type="text" value="Text A"><input type="text" value="C"><button class="btn sm">×</button></div><div class="optionrow"><b>2</b><input type="text" value="Text B"><input type="text" value="A"><button class="btn sm">×</button></div><button class="btn sm">+ Thêm cặp</button></div>`;if(s.qtype==='cloze'||s.qtype==='wordbank')return `<h3>4. Đáp án điền từ</h3><div class="help">Đặt marker như <b>{{1}}</b>, <b>{{2}}</b> trong văn bản. Sau đó khai báo đáp án cho từng ô trống.</div><div class="box"><div class="optionrow"><b>1</b><input type="text" value="haben"><select class="field"><option>Đáp án đúng</option></select><button class="btn sm">×</button></div><button class="btn sm">+ Thêm ô trống</button></div>`;return `<h3>4. Đáp án</h3><div class="box"><div class="optionrow"><input type="radio" name="correct" checked><input type="text" value="Đáp án A"><span class="sub">Đúng</span><button class="btn sm">×</button></div><div class="optionrow"><input type="radio" name="correct"><input type="text" value="Đáp án B"><span class="sub"></span><button class="btn sm">×</button></div><div class="optionrow"><input type="radio" name="correct"><input type="text" value="Đáp án C"><span class="sub"></span><button class="btn sm">×</button></div><button class="btn sm">+ Thêm đáp án</button></div>`}function examBuilder(edit){s.view='builder';app.innerHTML=top()+`<main class="container" style="max-width:1400px"><div class="toolbar"><div><div class="kicker">EXAM BUILDER</div><h1>${edit?'Chỉnh sửa TELC B1 – Đề 01':'Tạo bài thi mới'}</h1><div class="sub">Lưu nháp bất cứ lúc nào. Chỉ chủ bài hoặc Master Admin được sửa.</div></div><div><button class="btn" id="backadmin">← Quay lại</button> <button class="btn">Xem trước</button> <button class="btn" id="savedraft">Lưu nháp</button> <button class="btn primary" id="publish">Xuất bản</button></div></div><div class="builder"><aside class="buildernav"><div class="kicker">CẤU TRÚC BÀI THI</div><div class="group" style="margin:10px 0"><label>Tên bài thi</label><input value="${edit?'TELC B1 – Đề 01':'TELC B1 – Đề thi thử mới'}"></div><div class="group"><label>Mẫu</label><select><option>TELC B1</option><option>TELC B2</option><option>Tạo trống</option></select></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0">${['01 · Lesen','02 · Sprachbausteine','03 · Hören','04 · Schreiben','05 · Sprechen'].map((x,i)=>`<div class="sectionitem ${s.builderSection===i?'active':''}" data-sec="${i}"><b>${x}</b><div class="sub">${i===0?'3 Teile · 20 câu':i===1?'2 Teile · 20 câu':i===2?'3 Teile · Audio':i===3?'1 bài viết':'3 phần nói'}</div></div>`).join('')}</aside><section class="buildermain" id="buildermain">${builderSection()}</section><aside class="builderaside"><div class="kicker">CÀI ĐẶT PHẦN</div><div class="group" style="margin-top:10px"><label>Thời gian</label><input value="90 phút"></div><label class="checkrow"><input type="checkbox" checked> Hiển thị đồng hồ</label><label class="checkrow"><input type="checkbox" checked> Tự nộp khi hết giờ</label><label class="checkrow"><input type="checkbox"> Trộn thứ tự câu hỏi</label><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><b style="font-size:12px">Điểm phần hiện tại</b><div class="val">75</div><div class="sub">Tổng bài dự kiến: 300 điểm</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="help"><b>Lưu ý</b><br>Khi bài đã có lượt thi, nên tạo phiên bản mới thay vì sửa trực tiếp cấu trúc cũ.</div></aside></div></main>`;document.getElementById('backadmin').onclick=()=>{s.view='admin';render()};document.getElementById('savedraft').onclick=()=>note('Đã lưu bài thi ở trạng thái bản nháp.');document.getElementById('publish').onclick=()=>note('Bài thi đã được xuất bản cho học viên.');document.querySelectorAll('.sectionitem').forEach(x=>x.onclick=()=>{s.builderSection=+x.dataset.sec;examBuilder(edit)});bindBuilder()}function builderSection(){const names=['Lesen · Phần 1–3','Sprachbausteine · Phần 1–2','Hören · Phần 1–3','Schreiben','Sprechen'];return `<div class="toolbar"><div><div class="kicker">PHẦN ${s.builderSection+1}</div><h2 style="margin:5px 0">${names[s.builderSection]}</h2><div class="sub">Thêm câu từ ngân hàng hoặc tạo câu mới ngay trong đề.</div></div><div><button class="btn" id="addbank">+ Thêm từ ngân hàng</button> <button class="btn primary" id="createinline">+ Tạo câu mới</button></div></div>${s.builderSection<3?`<div class="qitem"><div class="left"><strong>Q-B1-001 · Homeoffice und Zusammenarbeit</strong><div class="sub">Matching · Lesen Teil 1 · 5 điểm</div></div><div><button class="btn sm">Xem</button> <button class="btn sm">↑</button> <button class="btn sm">↓</button> <button class="btn sm danger">Bỏ</button></div></div><div class="qitem"><div class="left"><strong>Q-B1-024 · Situationen und Anzeigen</strong><div class="sub">Two-column matching · 10 điểm</div></div><div><button class="btn sm">Xem</button> <button class="btn sm">↑</button> <button class="btn sm">↓</button> <button class="btn sm danger">Bỏ</button></div></div>`:`<div class="box"><b>${s.builderSection===3?'Bài viết Schreiben':'Bài thi Sprechen'}</b><p class="sub">Thiết lập đề bài, rubric, điểm tối đa và người chấm.</p><button class="btn sm" id="editmanual">Chỉnh nội dung & rubric</button></div>`}<div class="help" style="margin-top:14px"><b>Quy tắc hiển thị</b><br>Câu hỏi sẽ được render theo đúng loại đã chọn trong Question Bank. Với Hören có thể khóa pause/seek và giới hạn số lượt nghe.</div>`}function bindBuilder(){const a=document.getElementById('addbank');if(a)a.onclick=()=>bankPicker();const c=document.getElementById('createinline');if(c)c.onclick=()=>questionBuilder();const e=document.getElementById('editmanual');if(e)e.onclick=()=>questionBuilder()}function bankPicker(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="kicker">THÊM TỪ QUESTION BANK</div><h2>Chọn câu hỏi</h2></div><button class="btn sm" id="closem">✕</button></div><div class="filterbar"><input class="field search" placeholder="Tìm câu hỏi..."><select class="field"><option>B1</option><option>B2</option></select><select class="field"><option>Lesen</option><option>Hören</option><option>Sprachbausteine</option></select></div><div class="bankpick">${bank.slice(0,4).map(q=>`<label class="box"><div style="display:flex;gap:9px"><input type="checkbox"><div><b>${q.id} · ${q.title}</b><div class="sub">${q.level} · ${q.skill} · ${q.part} · ${q.type}</div><div class="sub" style="margin-top:5px">Người tạo: ${q.owner} · Tỷ lệ đúng ${q.correct}</div></div></div></label>`).join('')}</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" id="cancelpick">Hủy</button><button class="btn primary" id="addpicked">Thêm câu đã chọn</button></div></div></div>`);document.getElementById('closem').onclick=document.getElementById('cancelpick').onclick=()=>document.getElementById('modal').remove();document.getElementById('addpicked').onclick=()=>{document.getElementById('modal').remove();note('Đã thêm câu hỏi từ Ngân hàng vào bài thi.')}}function render(){syncRole();if(!s.role){login();return}if(s.role==='student'){if(s.view==='exam')exam();else if(s.view==='result')result();else dash()}else{if(s.view==='builder')return;admin()}}roles.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.role=b.dataset.r;s.view=s.role==='student'?'dash':'admin';render()});setInterval(()=>{if(s.view==='exam'&&s.time>0){s.time--;timer()}},1000);login()})();
</script></body></html>
