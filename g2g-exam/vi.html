hết giờ</label><label class="checkrow"><input type="checkbox"> Trộn thứ tự câu hỏi</label><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="help"><b>Gợi ý</b><br>Có thể thêm một phần mới, đổi tên, di chuyển lên/xuống hoặc bỏ phần không dùng. Khi bài đã có học viên thi, nên tạo phiên bản mới trước khi thay đổi cấu trúc.</div></aside></div></main>`;document.getElementById('backadmin').onclick=()=>{s.view='admin';render()};document.getElementById('savedraft').onclick=()=>note('Đã lưu bài thi ở trạng thái bản nháp.');document.getElementById('publish').onclick=()=>note('Bài thi đã được xuất bản cho học viên.');bindSections(edit);bindBuilder()}function sectionList(){return sections.map((x,i)=>`<div class="sectionitem ${s.builderSection===i?'active':''}" data-sec="${i}"><div class="sectionline"><div><b>${String(i+1).padStart(2,'0')} · ${x.name}</b><div class="sub">${x.sub}</div></div><div class="sectiontools"><button class="upsec" data-i="${i}" title="Đưa lên">↑</button><button class="downsec" data-i="${i}" title="Đưa xuống">↓</button><button class="delsec" data-i="${i}" title="Bỏ phần">×</button></div></div></div>`).join('')}function bindSections(edit){document.querySelectorAll('.sectionitem').forEach(x=>x.onclick=e=>{if(e.target.closest('.sectiontools'))return;s.builderSection=+x.dataset.sec;examBuilder(edit)});document.querySelectorAll('.upsec').forEach(x=>x.onclick=e=>{e.stopPropagation();const i=+x.dataset.i;if(i>0){[sections[i-1],sections[i]]=[sections[i],sections[i-1]];s.builderSection=i-1;examBuilder(edit)}});document.querySelectorAll('.downsec').forEach(x=>x.onclick=e=>{e.stopPropagation();const i=+x.dataset.i;if(i<sections.length-1){[sections[i+1],sections[i]]=[sections[i],sections[i+1]];s.builderSection=i+1;examBuilder(edit)}});document.querySelectorAll('.delsec').forEach(x=>x.onclick=e=>{e.stopPropagation();if(sections.length<=1){note('Bài thi phải còn ít nhất một phần.');return}sections.splice(+x.dataset.i,1);s.builderSection=Math.min(s.builderSection,sections.length-1);examBuilder(edit)});document.getElementById('addsection').onclick=()=>{sections.push({name:'Phần mới',sub:'Chưa có câu hỏi',time:'30 phút'});s.builderSection=sections.length-1;examBuilder(edit)};document.getElementById('secname').onchange=e=>{sections[s.builderSection].name=e.target.value;note('Đã đổi tên phần.')}}function builderSection(){const sec=sections[s.builderSection]||sections[0];return `<div class="toolbar"><div><div class="kicker">PHẦN ${s.builderSection+1}</div><h2 style="margin:5px 0">${sec.name}</h2><div class="sub">Thêm câu từ ngân hàng hoặc tạo câu mới ngay trong phần này.</div></div><div><button class="btn" id="addbank">+ Thêm từ ngân hàng</button> <button class="btn primary" id="createinline">+ Tạo câu mới</button></div></div><div class="qitem"><div class="left"><strong>Q-B1-001 · Homeoffice und Zusammenarbeit</strong><div class="sub">Ghép nội dung · 5 điểm</div></div><div><button class="btn sm">Xem</button> <button class="btn sm">↑</button> <button class="btn sm">↓</button> <button class="btn sm danger">Bỏ</button></div></div><div class="qitem"><div class="left"><strong>Q-B1-024 · Situationen und Anzeigen</strong><div class="sub">Ghép hai cột · 10 điểm</div></div><div><button class="btn sm">Xem</button> <button class="btn sm">↑</button> <button class="btn sm">↓</button> <button class="btn sm danger">Bỏ</button></div></div><div class="help" style="margin-top:14px"><b>Thứ tự câu hỏi</b><br>Có thể dùng nút ↑ ↓ để sắp xếp câu. Nếu muốn lấy toàn bộ câu phù hợp từ Ngân hàng câu hỏi, bấm “Thêm từ ngân hàng” rồi chọn “Chọn tất cả”.</div>`}function bindBuilder(){document.getElementById('addbank').onclick=()=>bankPicker();document.getElementById('createinline').onclick=()=>questionBuilder()}function bankPicker(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="kicker">THÊM TỪ NGÂN HÀNG CÂU HỎI</div><h2>Chọn câu hỏi để thêm vào phần</h2></div><button class="btn sm" id="closem">✕</button></div><div class="filterbar"><input class="field search" placeholder="Tìm câu hỏi..."><select class="field"><option>B1</option><option>B2</option></select><select class="field"><option>Tất cả kỹ năng</option><option>Đọc hiểu</option><option>Ngữ pháp</option><option>Nghe hiểu</option></select></div><label class="checkrow" style="font-weight:800;margin:12px 0"><input type="checkbox" id="selectall"> Chọn tất cả câu hỏi đang hiển thị</label><div class="bankpick">${bank.map(q=>`<label class="box"><div style="display:flex;gap:9px"><input class="pickq" type="checkbox"><div><b>${q.id} · ${q.title}</b><div class="sub">${q.level} · ${q.skill} · ${q.part} · ${q.type}</div><div class="sub" style="margin-top:5px">Người tạo: ${q.owner} · Tỷ lệ đúng ${q.correct}</div></div></div></label>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px"><div class="sub" id="selectedCount">Đã chọn 0 câu</div><div><button class="btn" id="cancelpick">Hủy</button> <button class="btn primary" id="addpicked">Thêm câu đã chọn</button></div></div></div></div>`);const all=document.getElementById('selectall'),items=[...document.querySelectorAll('.pickq')],count=document.getElementById('selectedCount');function upd(){const n=items.filter(x=>x.checked).length;count.textContent='Đã chọn '+n+' câu';all.checked=n===items.length&&items.length>0;all.indeterminate=n>0&&n<items.length}all.onchange=()=>{items.forEach(x=>x.checked=all.checked);upd()};items.forEach(x=>x.onchange=upd);document.getElementById('closem').onclick=document.getElementById('cancelpick').onclick=()=>document.getElementById('modal').remove();document.getElementById('addpicked').onclick=()=>{const n=items.filter(x=>x.checked).length;if(!n){note('Hãy chọn ít nhất một câu hỏi.');return}document.getElementById('modal').remove();note('Đã thêm '+n+' câu hỏi vào phần hiện tại.')}}function render(){syncRole();if(!s.role){login();return}if(s.role==='student'){if(s.view==='exam')exam();else if(s.view==='result')result();else if(s.view==='studentresults')studentResults();else dash()}else{if(s.view==='builder'||s.view==='gradingdetail')return;admin()}}roles.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.role=b.dataset.r;s.view=s.role==='student'?'dash':'admin';render()});setInterval(()=>{if(s.view==='exam'&&s.time>0){s.time--;timer()}},1000);login()})();
</script></body></html>
