<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>G2G Thi thử tiếng Đức</title>
  <meta name="description" content="Hệ thống thi thử tiếng Đức G2G, mô phỏng trải nghiệm thi trên máy tính.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261009-91">
  <link rel="stylesheet" href="./enhancements.css?v=20261008-26">
  <style>
    .boot-shell{width:100%;position:relative}
    .boot-layout{position:absolute;pointer-events:none;overflow:hidden}
    .boot-layout-surface{background:var(--mat);border:1px solid var(--vien)}
    .boot-layout-line,.boot-layout-media{background:var(--vien);animation:boot-pulse 1.6s ease-in-out infinite alternate}
    .boot-layout .thuong-hieu{animation:none}
    .boot-shape{background:var(--vien);border-radius:12px;height:3px;animation:boot-pulse 1.6s ease-in-out infinite alternate}
    .boot-progress{margin:24px 0;width:100%}
    .boot-feedback{position:relative;z-index:1;background:var(--mat);border-radius:12px;color:#626870;font-size:14px;line-height:1.5}.boot-feedback:empty{display:none}
    .boot-feedback button{margin-left:8px;padding:8px 16px;border:1px solid #e4e6e9;border-radius:24px;background:#fff;color:#101318;cursor:pointer;font:inherit}
    @keyframes boot-pulse{to{opacity:.5}}
    .boot-shell[aria-busy="false"] :is(.boot-shape,.boot-layout-line,.boot-layout-media){animation:none}
    @media(prefers-reduced-motion:reduce){.boot-shape,.boot-layout-line,.boot-layout-media{animation:none}}
  </style>
  <script>
    function showBootError(){
      var status=document.getElementById('bootStatus');
      if(!status)return;
      var shell=document.getElementById('bootShell');
      if(shell)shell.setAttribute('aria-busy','false');
      status.innerHTML='Hệ thống chưa tải được đầy đủ. Vui lòng thử lại.<button type="button" onclick="location.reload()">Thử lại</button>';
    }
    window.addEventListener('error',showBootError);
    window.addEventListener('unhandledrejection',showBootError);
    window.setTimeout(showBootError,20000);
  </script>
</head>
<body>
  <div id="app">
    <div class="boot-shell" id="bootShell" aria-busy="true" aria-label="Đang chuẩn bị giao diện">
      <div aria-hidden="true" data-boot-fallback>
        <header class="thanh-dau"><div class="thuong-hieu"><div class="logo"><img src="/brand/logo" width="48" height="48" alt=""></div><div class="ten-he-thong"><strong>Luyện thi tiếng Đức</strong><small>G2G Career</small></div></div></header>
        <div class="boot-shape boot-progress"></div>
      </div>
      <p class="boot-feedback" id="bootStatus" role="status"></p>
      <noscript>Vui lòng bật JavaScript để sử dụng website.</noscript>
    </div>
  </div>
  <script src="./src/ui/boot-layout.js?v=1"></script>
  <div id="toast" class="thong-bao an"></div>
  <script src="./runtime-config.js?v=20261008-26"></script>
  <script type="module" src="./src/app.js?v=20261009-91"></script>
  <script type="module" src="./src/feature-loader.js?v=20261009-73"></script>
</body>
</html>
