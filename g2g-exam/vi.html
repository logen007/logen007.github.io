<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>G2G Thi thử tiếng Đức</title>
  <meta name="description" content="Hệ thống thi thử tiếng Đức G2G, mô phỏng trải nghiệm thi trên máy tính.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261009-85">
  <link rel="stylesheet" href="./enhancements.css?v=20261008-26">
  <script>
    function showBootError(){
      var status=document.getElementById('bootStatus');
      if(!status)return;
      status.innerHTML='<strong>Hệ thống chưa tải được đầy đủ.</strong><br>Hãy <button type="button" onclick="location.reload()" style="border:0;background:none;padding:0;text-decoration:underline;cursor:pointer">Tải lại</button>.';
      status.style.color='#8a3b12';
    }
    window.addEventListener('error',showBootError);
    window.addEventListener('unhandledrejection',showBootError);
    window.setTimeout(showBootError,20000);
  </script>
</head>
<body>
  <div id="app">
    <div class="loading" id="bootStatus" role="status">Đang tải Luyện thi tiếng Đức…</div>
  </div>
  <div id="toast" class="thong-bao an"></div>
  <script src="./runtime-config.js?v=20261008-26"></script>
  <script type="module" src="./src/app.js?v=20261009-85"></script>
  <script type="module" src="./src/feature-loader.js?v=20261009-73"></script>
</body>
</html>
