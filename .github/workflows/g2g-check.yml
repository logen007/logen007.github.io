name: G2G Exam Check

on:
  push:
    paths:
      - 'g2g-exam/**'
      - '.github/workflows/g2g-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: sh g2g-exam/server/check-code.sh
      - name: Install backend dependencies for tests
        run: npm ci --prefix g2g-exam/server --ignore-scripts
      - name: Run tests
        working-directory: g2g-exam
        run: npm test && node tests/legal-pages.test.mjs
      - name: Check R2 settings and VPS fallback
        working-directory: g2g-exam
        run: npm run test:r2
      - name: Check Backup API, job progress and UI
        working-directory: g2g-exam
        run: node tests/backup-control.test.mjs && node tests/backup-policy.test.mjs && node tests/backup-progress.test.mjs && node tests/backup-page.test.mjs
      - name: Install isolated SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/g2g-test-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
      - name: Check exam codes and promotions against SQL
        working-directory: g2g-exam
        run: G2G_PGLITE_PATH="$RUNNER_TEMP/g2g-test-db/node_modules/@electric-sql/pglite/dist/index.js" node tests/backend-access.integration.mjs
      - name: Check completion threshold and expiry against SQL
        working-directory: g2g-exam
        run: G2G_PGLITE_PATH="$RUNNER_TEMP/g2g-test-db/node_modules/@electric-sql/pglite/dist/index.js" node tests/exam-completion.integration.mjs
