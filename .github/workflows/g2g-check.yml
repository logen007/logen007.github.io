name: G2G Exam Check

on:
  push:
    paths:
      - 'g2g-exam/**'
      - '.github/workflows/g2g-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: sh g2g-exam/server/check-code.sh
      - name: Run tests
        working-directory: g2g-exam
        run: npm test
