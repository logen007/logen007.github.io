name: G2G App Refactor Patch

on:
  push:
    branches:
      - refactor/g2g-architecture-20261007
    paths:
      - g2g-exam/scripts/refactor-app.mjs
      - .github/workflows/g2g-refactor-app.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/g2g-architecture-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch app.js
        run: node g2g-exam/scripts/refactor-app.mjs
      - name: Validate
        working-directory: g2g-exam
        run: |
          sh server/check-code.sh
          npm test
      - name: Commit generated refactor
        run: |
          if git diff --quiet -- g2g-exam/src/app.js; then exit 0; fi
          git config user.name "g2g-refactor-bot"
          git config user.email "g2g-refactor-bot@users.noreply.github.com"
          git add g2g-exam/src/app.js
          git commit -m "refactor(g2g): move exam creation to spec factory"
          git push origin HEAD:refactor/g2g-architecture-20261007
