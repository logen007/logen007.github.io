name: G2G Exam Tests

on:
  push:
    paths:
      - 'g2g-exam/**'
      - '.github/workflows/g2g-exam-tests.yml'
  pull_request:
    paths:
      - 'g2g-exam/**'

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run core workflow tests
        run: node g2g-exam/tests/core.test.mjs
