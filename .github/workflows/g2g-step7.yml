name: G2G Step 7 Refactor

on:
  push:
    branches:
      - refactor/g2g-part-template-step7
    paths:
      - 'g2g-exam/scripts/step7-refactor.mjs'
      - '.github/workflows/g2g-step7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/g2g-part-template-step7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved step 7 refactor
        run: node g2g-exam/scripts/step7-refactor.mjs
      - name: Check JavaScript syntax
        run: sh g2g-exam/server/check-code.sh
      - name: Run tests
        working-directory: g2g-exam
        run: npm test
      - name: Remove temporary refactor helpers
        run: rm -f g2g-exam/scripts/step7-refactor.mjs .github/workflows/g2g-step7.yml
      - name: Commit refactor result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(g2g): modularize A1 listening part template'
          git push origin HEAD:refactor/g2g-part-template-step7
