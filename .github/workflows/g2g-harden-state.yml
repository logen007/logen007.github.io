name: G2G State Hardening Patch

on:
  push:
    branches:
      - refactor/g2g-architecture-20261007
    paths:
      - g2g-exam/scripts/harden-state.mjs
      - .github/workflows/g2g-harden-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/g2g-architecture-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node g2g-exam/scripts/harden-state.mjs
      - name: Validate
        working-directory: g2g-exam
        run: |
          sh server/check-code.sh
          npm test
      - name: Commit hardening
        run: |
          if git diff --quiet -- g2g-exam/server/src/state.js; then exit 0; fi
          git config user.name "g2g-refactor-bot"
          git config user.email "g2g-refactor-bot@users.noreply.github.com"
          git add g2g-exam/server/src/state.js
          git commit -m "fix(g2g): harden trash restore and group deletion"
          git push origin HEAD:refactor/g2g-architecture-20261007
