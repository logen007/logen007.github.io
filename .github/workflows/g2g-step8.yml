name: G2G Step 8 Refactor

on:
  push:
    branches:
      - refactor/g2g-builder-step8

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/g2g-builder-step8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved Step 8 refactor
        working-directory: g2g-exam
        run: node scripts/step8-builder-refactor.mjs
      - name: Preserve builder guidance label
        working-directory: g2g-exam
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='src/part-templates/default/builder.js';
          let source=fs.readFileSync(file,'utf8');
          source=source.replace('<div class="goethe-instruction">','<p class="phu-de">Tạo câu hỏi trực tiếp trong phần này.</p><div class="goethe-instruction">');
          fs.writeFileSync(file,source);
          NODE
      - name: Check JavaScript syntax
        working-directory: g2g-exam
        run: find src server/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run tests
        working-directory: g2g-exam
        run: npm test
      - name: Remove temporary migration helpers
        run: |
          rm -f g2g-exam/scripts/step8-builder-refactor.mjs
          rm -f .github/workflows/g2g-step8.yml
      - name: Commit refactor result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(g2g): route builder through part templates'
          git push origin HEAD:refactor/g2g-builder-step8
