name: G2G Exam CI

on:
  push:
    paths:
      - 'g2g-exam/**'
      - '.github/workflows/g2g-exam-ci.yml'
  pull_request:
    paths:
      - 'g2g-exam/**'
      - '.github/workflows/g2g-exam-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Core logic tests
        working-directory: g2g-exam
        run: npm test

      - name: Check Cloud Functions syntax
        run: node --check g2g-exam/functions/index.js

      - name: Check frontend module syntax
        run: node --check g2g-exam/src/app.js && node --check g2g-exam/src/core.js && node --check g2g-exam/src/repository.js
